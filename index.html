<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RikuDrop</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background: #f5f7fb;
    color: #222;
}

.container {
    width: min(750px, 92%);
    margin: 30px auto;
}

h1 {
    text-align: center;
    margin-bottom: 5px;
}

.subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 25px;
}


/* ================================
   カード
================================ */

.card {
    background: white;
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 18px;

    box-shadow:
        0 4px 15px rgba(0,0,0,0.08);
}


/* ================================
   ラベル
================================ */

label {
    display: block;
    font-weight: bold;
    margin-bottom: 8px;
}


/* ================================
   入力
================================ */

input[type="text"] {
    width: 100%;
    padding: 12px;

    border: 1px solid #ddd;
    border-radius: 10px;

    font-size: 16px;
}


/* ================================
   ボタン
================================ */

button {
    width: 100%;

    padding: 13px;

    border: none;
    border-radius: 10px;

    background: #333;
    color: white;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;

    margin-top: 10px;
}

button:hover {
    opacity: 0.9;
}

button:disabled {
    background: #aaa;
    cursor: not-allowed;
}


/* ================================
   役割ボタン
================================ */

.roles {
    display: flex;
    gap: 10px;
}

.roles button {
    flex: 1;
}


/* ================================
   ステータス
================================ */

.status {
    padding: 14px;

    background: #f0f3f8;

    border-radius: 10px;

    text-align: center;

    font-weight: bold;
}


/* ================================
   ファイル選択
================================ */

.file-select-area {
    border: 2px dashed #ccc;

    border-radius: 12px;

    padding: 20px;

    text-align: center;

    cursor: pointer;
}

.file-select-area:hover {
    background: #f8f8f8;
}

#file {
    width: 100%;
}


/* ================================
   選択画像一覧
================================ */

.selected-files {
    margin-top: 15px;
}

.selected-file {
    display: flex;

    align-items: center;

    gap: 10px;

    padding: 10px;

    margin-bottom: 8px;

    background: #f5f7fb;

    border-radius: 10px;
}

.selected-file-name {
    flex: 1;

    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;
}

.remove-file {
    width: 35px;

    padding: 7px;

    margin: 0;

    background: #d9534f;

    font-size: 14px;
}

.clear-button {
    background: #777;

    font-size: 14px;
}


/* ================================
   受信画像
================================ */

.received-grid {
    display: grid;

    grid-template-columns:
        repeat(auto-fit, minmax(180px, 1fr));

    gap: 15px;

    margin-top: 15px;
}

.received-item {
    background: #f5f7fb;

    border-radius: 12px;

    padding: 12px;

    text-align: center;
}

.received-item img {
    width: 100%;

    max-height: 250px;

    object-fit: contain;

    border-radius: 8px;

    background: white;
}

.received-name {
    margin-top: 8px;

    font-size: 13px;

    word-break: break-all;
}

.download-button {
    background: #16833b;

    font-size: 14px;

    margin-top: 8px;
}


/* ================================
   ログ
================================ */

.log {
    height: 300px;

    overflow-y: auto;

    background: #111;

    color: #eee;

    padding: 12px;

    border-radius: 10px;

    font-family: monospace;

    font-size: 13px;

    white-space: pre-wrap;
}


/* ================================
   説明
================================ */

.info {
    font-size: 14px;

    color: #666;

    line-height: 1.6;

    margin-top: 8px;
}


/* ================================
   進捗
================================ */

.progress-area {
    margin-top: 15px;

    display: none;
}

.progress-bar-background {
    width: 100%;

    height: 12px;

    background: #ddd;

    border-radius: 10px;

    overflow: hidden;
}

.progress-bar {
    width: 0%;

    height: 100%;

    background: #333;

    transition: width 0.1s;
}

.progress-text {
    text-align: center;

    margin-top: 7px;

    font-size: 14px;
}

</style>
</head>


<body>

<div class="container">

<h1>📱 RikuDrop</h1>

<div class="subtitle">
iPhone ↔ Windows 画像転送
</div>


<!-- ======================================
     部屋
======================================= -->

<div class="card">

<label>① 同じ部屋番号を入力</label>

<input
    id="room"
    type="text"
    placeholder="例：1234"
>

<div class="info">
iPhoneとWindowsで同じ番号を入力してください。
</div>

</div>


<!-- ======================================
     役割
======================================= -->

<div class="card">

<label>② 自分の端末を選択</label>

<div class="roles">

<button onclick="start('windows')">
💻 Windows
</button>

<button onclick="start('iphone')">
📱 iPhone
</button>

</div>

</div>


<!-- ======================================
     接続状態
======================================= -->

<div class="card">

<label>接続状態</label>

<div
    id="status"
    class="status"
>
未接続
</div>

</div>


<!-- ======================================
     画像選択
======================================= -->

<div class="card">

<label>③ 送信する画像を選択</label>

<div class="file-select-area">

<input
    id="file"
    type="file"
    accept="image/*"
    multiple
>

<div class="info">
複数の画像を同時に選択できます
</div>

</div>


<!-- 選択画像一覧 -->

<div
    id="selectedFiles"
    class="selected-files"
></div>


<button
    class="clear-button"
    onclick="clearSelectedFiles()"
>
🗑️ 選択をすべて解除
</button>


<button
    id="sendButton"
    onclick="sendFiles()"
    disabled
>
📤 選択した画像を送信
</button>


<!-- 進捗 -->

<div
    id="progressArea"
    class="progress-area"
>

<div class="progress-bar-background">

<div
    id="progressBar"
    class="progress-bar"
></div>

</div>

<div
    id="progressText"
    class="progress-text"
>
0%
</div>

</div>

</div>


<!-- ======================================
     受信画像
======================================= -->

<div class="card">

<label>📥 受信した画像</label>

<div
    id="received"
    class="received-grid"
></div>

<div
    id="noReceived"
    class="info"
>
まだ画像を受信していません
</div>

</div>


<!-- ======================================
     ログ
======================================= -->

<div class="card">

<label>接続ログ</label>

<div
    id="log"
    class="log"
></div>

</div>

</div>


<script>


/* =========================================================
   基本設定
========================================================= */

const WORKER_URL =
    "https://ancient-wind-96c6.rikuhira115.workers.dev";


/*
 * Cloudflare STUN
 *
 * TURNは使用しません。
 */
const ICE_SERVERS = [
    {
        urls:
            "stun:stun.cloudflare.com:3478"
    }
];


let pc = null;

let ws = null;

let dataChannel = null;

let role = null;

let roomId = null;

let remoteDescriptionSet = false;

let pendingCandidates = [];


/* =========================================================
   複数ファイル送信用
========================================================= */

let selectedFiles = [];


/* =========================================================
   受信ファイル
========================================================= */

let receiveBuffers = [];

let receiveSize = 0;

let receiveFileName = "";

let receiveFileType = "";

let receiveFileSize = 0;


/* =========================================================
   ログ
========================================================= */

function log(message) {

    const time =
        new Date().toLocaleTimeString();

    const logElement =
        document.getElementById("log");

    logElement.textContent +=
        `[${time}] ${message}\n`;

    logElement.scrollTop =
        logElement.scrollHeight;

    console.log(message);
}


/* =========================================================
   ステータス
========================================================= */

function setStatus(message) {

    document.getElementById("status")
        .textContent = message;
}


/* =========================================================
   ファイル選択
========================================================= */

document
    .getElementById("file")
    .addEventListener(
        "change",
        function() {

            /*
             * 新しく選択したファイルを追加
             */

            for (
                const file of this.files
            ) {

                /*
                 * 画像だけ許可
                 */

                if (
                    !file.type.startsWith(
                        "image/"
                    )
                ) {

                    continue;
                }


                /*
                 * 同じファイルが
                 * 重複して入らないようにする
                 */

                const alreadyExists =
                    selectedFiles.some(
                        existing =>
                            existing.name ===
                            file.name &&
                            existing.size ===
                            file.size &&
                            existing.lastModified ===
                            file.lastModified
                    );


                if (
                    !alreadyExists
                ) {

                    selectedFiles.push(
                        file
                    );
                }
            }


            renderSelectedFiles();


            /*
             * inputをリセット
             *
             * 同じ画像を再度選択できるようにする
             */

            this.value = "";
        }
    );


/* =========================================================
   選択ファイル表示
========================================================= */

function renderSelectedFiles() {

    const container =
        document.getElementById(
            "selectedFiles"
        );


    container.innerHTML = "";


    if (
        selectedFiles.length === 0
    ) {

        container.innerHTML =
            '<div class="info">画像が選択されていません</div>';

        return;
    }


    selectedFiles.forEach(
        (file, index) => {

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "selected-file";


            const name =
                document.createElement(
                    "div"
                );

            name.className =
                "selected-file-name";

            name.textContent =
                `${index + 1}. ${file.name}`;


            const size =
                document.createElement(
                    "small"
                );

            size.textContent =
                formatFileSize(
                    file.size
                );


            const removeButton =
                document.createElement(
                    "button"
                );

            removeButton.className =
                "remove-file";

            removeButton.textContent =
                "×";

            removeButton.title =
                "この画像を選択解除";


            removeButton.onclick =
                () => {

                    removeSelectedFile(
                        index
                    );
                };


            item.appendChild(
                name
            );

            item.appendChild(
                size
            );

            item.appendChild(
                removeButton
            );


            container.appendChild(
                item
            );
        }
    );

}


/* =========================================================
   選択ファイルを1つ解除
========================================================= */

function removeSelectedFile(index) {

    const file =
        selectedFiles[index];


    if (file) {

        log(
            "選択解除: " +
            file.name
        );
    }


    selectedFiles.splice(
        index,
        1
    );


    renderSelectedFiles();
}


/* =========================================================
   選択ファイルを全部解除
========================================================= */

function clearSelectedFiles() {

    if (
        selectedFiles.length === 0
    ) {

        return;
    }


    log(
        selectedFiles.length +
        "個の画像選択を解除しました"
    );


    selectedFiles = [];


    renderSelectedFiles();
}


/* =========================================================
   ファイルサイズ表示
========================================================= */

function formatFileSize(bytes) {

    if (
        bytes < 1024
    ) {

        return bytes + " B";
    }


    if (
        bytes < 1024 * 1024
    ) {

        return (
            (bytes / 1024)
            .toFixed(1)
            +
            " KB"
        );
    }


    return (
        (bytes / (1024 * 1024))
        .toFixed(1)
        +
        " MB"
    );
}


/* =========================================================
   Cloudflare WebSocket接続
========================================================= */

function connectSignaling() {

    return new Promise(
        (resolve, reject) => {

            const url =
                WORKER_URL +
                "/room/" +
                encodeURIComponent(
                    roomId
                );


            log(
                "Cloudflare WebSocketへ接続しています..."
            );


            ws =
                new WebSocket(url);


            ws.onopen = () => {

                log(
                    "✓ Cloudflare WebSocket接続成功"
                );

                resolve();
            };


            ws.onerror = (error) => {

                log(
                    "× WebSocketエラー"
                );

                console.error(error);

                reject(error);
            };


            ws.onclose = () => {

                log(
                    "Cloudflare WebSocket切断"
                );
            };


            ws.onmessage =
                async (event) => {

                    try {

                        const message =
                            JSON.parse(
                                event.data
                            );


                        await handleSignal(
                            message
                        );

                    } catch (error) {

                        log(
                            "× 受信データ処理エラー: " +
                            error.message
                        );
                    }
                };

        }
    );

}


/* =========================================================
   シグナリング送信
========================================================= */

function sendSignal(message) {

    if (
        ws &&
        ws.readyState ===
        WebSocket.OPEN
    ) {

        ws.send(
            JSON.stringify(message)
        );


        log(
            "→ シグナリング送信: " +
            message.type
        );

    } else {

        log(
            "× WebSocketが接続されていません"
        );
    }
}


/* =========================================================
   WebRTC作成
========================================================= */

function createPeerConnection() {

    log(
        "WebRTC接続を作成します..."
    );


    pc =
        new RTCPeerConnection({
            iceServers:
                ICE_SERVERS
        });


    log(
        "STUNサーバー: " +
        "stun.cloudflare.com:3478"
    );


    /* -----------------------------------------
       ICE候補
    ----------------------------------------- */

    pc.onicecandidate =
        (event) => {

            if (
                event.candidate
            ) {

                const candidate =
                    event.candidate;


                let type =
                    "unknown";


                const text =
                    candidate.candidate ||
                    "";


                if (
                    text.includes(
                        " typ host "
                    )
                ) {

                    type =
                        "host";

                } else if (
                    text.includes(
                        " typ srflx "
                    )
                ) {

                    type =
                        "srflx";

                } else if (
                    text.includes(
                        " typ relay "
                    )
                ) {

                    type =
                        "relay";
                }


                log(
                    `ICE候補: ${type} / ` +
                    `${candidate.protocol || ""}`
                );


                sendSignal({
                    type:
                        "ice-candidate",

                    candidate:
                        candidate.toJSON()
                });


            } else {

                log(
                    "✓ ICE候補の収集が終了しました"
                );
            }

        };


    /* -----------------------------------------
       ICE候補収集状態
    ----------------------------------------- */

    pc.onicegatheringstatechange =
        () => {

            log(
                "ICE候補収集状態: " +
                pc.iceGatheringState
            );
        };


    /* -----------------------------------------
       ICE接続状態
    ----------------------------------------- */

    pc.oniceconnectionstatechange =
        () => {

            log(
                "🌐 ICE接続状態: " +
                pc.iceConnectionState
            );


            if (
                pc.iceConnectionState ===
                "checking"
            ) {

                setStatus(
                    "接続確認中..."
                );
            }


            if (
                pc.iceConnectionState ===
                "connected"
            ) {

                setStatus(
                    "🟢 接続しました"
                );

                log(
                    "🎉 ICE接続成功！"
                );
            }


            if (
                pc.iceConnectionState ===
                "completed"
            ) {

                setStatus(
                    "🟢 接続完了"
                );

                log(
                    "🎉 ICE接続完了！"
                );
            }


            if (
                pc.iceConnectionState ===
                "disconnected"
            ) {

                setStatus(
                    "🟠 接続が切断されました"
                );
            }


            if (
                pc.iceConnectionState ===
                "failed"
            ) {

                setStatus(
                    "🔴 接続失敗"
                );

                log(
                    "× ICE接続に失敗しました"
                );
            }
        };


    /* -----------------------------------------
       WebRTC接続状態
    ----------------------------------------- */

    pc.onconnectionstatechange =
        () => {

            log(
                "WebRTC状態: " +
                pc.connectionState
            );


            if (
                pc.connectionState ===
                "connected"
            ) {

                setStatus(
                    "🟢 WebRTC接続成功"
                );
            }


            if (
                pc.connectionState ===
                "failed"
            ) {

                setStatus(
                    "🔴 WebRTC接続失敗"
                );
            }
        };


    /* -----------------------------------------
       ICEエラー
    ----------------------------------------- */

    pc.onicecandidateerror =
        (event) => {

            log(
                "⚠ ICE候補エラー"
            );

            log(
                "   code: " +
                event.errorCode
            );

            log(
                "   text: " +
                event.errorText
            );
        };


    /* -----------------------------------------
       iPhone側
    ----------------------------------------- */

    if (
        role === "iphone"
    ) {

        log(
            "iPhone側：DataChannelを作成"
        );


        dataChannel =
            pc.createDataChannel(
                "rikuDrop"
            );


        setupDataChannel(
            dataChannel
        );
    }


    /* -----------------------------------------
       Windows側
    ----------------------------------------- */

    pc.ondatachannel =
        (event) => {

            log(
                "📦 DataChannelを受信しました"
            );


            dataChannel =
                event.channel;


            setupDataChannel(
                dataChannel
            );
        };

}


/* =========================================================
   DataChannel設定
========================================================= */

function setupDataChannel(
    channel
) {

    channel.binaryType =
        "arraybuffer";


    channel.onopen =
        () => {

            log(
                "🎉 DataChannel接続成功！"
            );


            setStatus(
                "🟢 接続完了・送信できます"
            );


            document.getElementById(
                "sendButton"
            ).disabled = false;
        };


    channel.onclose =
        () => {

            log(
                "DataChannel切断"
            );


            document.getElementById(
                "sendButton"
            ).disabled = true;
        };


    channel.onerror =
        (error) => {

            log(
                "× DataChannelエラー"
            );

            console.error(error);
        };


    channel.onmessage =
        (event) => {

            handleDataMessage(
                event.data
            );
        };

}


/* =========================================================
   シグナリング受信
========================================================= */

async function handleSignal(
    message
) {

    if (!pc) {

        return;
    }


    /* -----------------------------------------
       Offer
    ----------------------------------------- */

    if (
        message.type ===
        "offer"
    ) {

        log(
            "← Offer受信"
        );


        await pc.setRemoteDescription(
            new RTCSessionDescription(
                message.offer
            )
        );


        remoteDescriptionSet =
            true;


        log(
            "✓ Offer設定完了"
        );


        await addPendingCandidates();


        const answer =
            await pc.createAnswer();


        await pc.setLocalDescription(
            answer
        );


        log(
            "Answer作成"
        );


        sendSignal({
            type:
                "answer",

            answer:
                answer
        });


        log(
            "→ Answer送信"
        );
    }


    /* -----------------------------------------
       Answer
    ----------------------------------------- */

    else if (
        message.type ===
        "answer"
    ) {

        log(
            "← Answer受信"
        );


        await pc.setRemoteDescription(
            new RTCSessionDescription(
                message.answer
            )
        );


        remoteDescriptionSet =
            true;


        log(
            "✓ Answer設定完了"
        );


        await addPendingCandidates();
    }


    /* -----------------------------------------
       ICE Candidate
    ----------------------------------------- */

    else if (
        message.type ===
        "ice-candidate"
    ) {

        const candidate =
            new RTCIceCandidate(
                message.candidate
            );


        if (
            remoteDescriptionSet
        ) {

            try {

                await pc.addIceCandidate(
                    candidate
                );


                log(
                    "✓ ICE候補を追加しました"
                );

            } catch (error) {

                log(
                    "× ICE候補追加失敗: " +
                    error.message
                );
            }

        } else {

            pendingCandidates.push(
                candidate
            );


            log(
                "ICE候補を一時保存しました"
            );
        }
    }

}


/* =========================================================
   待機中ICE候補
========================================================= */

async function addPendingCandidates() {

    for (
        const candidate
        of pendingCandidates
    ) {

        try {

            await pc.addIceCandidate(
                candidate
            );


            log(
                "✓ 保存していたICE候補を追加"
            );

        } catch (error) {

            log(
                "× 保存候補追加失敗: " +
                error.message
            );
        }
    }


    pendingCandidates = [];
}


/* =========================================================
   起動
========================================================= */

async function start(
    selectedRole
) {

    if (
        !document
            .getElementById("room")
            .value
            .trim()
    ) {

        alert(
            "部屋番号を入力してください"
        );

        return;
    }


    roomId =
        document
            .getElementById("room")
            .value
            .trim();


    role =
        selectedRole;


    log(
        "================================"
    );

    log(
        "RikuDrop開始"
    );

    log(
        "役割: " +
        role
    );

    log(
        "部屋: " +
        roomId
    );

    log(
        "================================"
    );


    setStatus(
        "接続準備中..."
    );


    try {

        createPeerConnection();


        await connectSignaling();


        setStatus(
            "🟡 相手を待っています..."
        );


        /*
         * iPhoneがOfferを作成
         */

        if (
            role === "iphone"
        ) {

            log(
                "iPhone側の準備完了"
            );


            log(
                "Offerを作成します..."
            );


            const offer =
                await pc.createOffer();


            await pc.setLocalDescription(
                offer
            );


            log(
                "Offer作成完了"
            );


            sendSignal({
                type:
                    "offer",

                offer:
                    offer
            });


            log(
                "✓ Offer送信"
            );


        } else {

            log(
                "Windows側の準備完了"
            );


            log(
                "iPhone側の接続を待っています..."
            );
        }


    } catch (error) {

        console.error(error);


        log(
            "× 起動エラー: " +
            error.message
        );


        setStatus(
            "🔴 エラー"
        );
    }

}


/* =========================================================
   複数ファイル送信
========================================================= */

async function sendFiles() {

    if (
        !dataChannel ||
        dataChannel.readyState !==
        "open"
    ) {

        alert(
            "まだ接続されていません"
        );

        return;
    }


    if (
        selectedFiles.length === 0
    ) {

        alert(
            "送信する画像を選択してください"
        );

        return;
    }


    const files =
        [...selectedFiles];


    log(
        "================================"
    );


    log(
        `📤 ${files.length}個の画像を送信開始`
    );


    document.getElementById(
        "sendButton"
    ).disabled = true;


    document.getElementById(
        "progressArea"
    ).style.display =
        "block";


    try {

        /*
         * 1枚ずつ順番に送信
         */

        for (
            let i = 0;
            i < files.length;
            i++
        ) {

            const file =
                files[i];


            log(
                `📤 [${i + 1}/${files.length}] ${file.name}`
            );


            await sendSingleFile(
                file,
                i,
                files.length
            );
        }


        log(
            "🎉 すべての画像を送信しました！"
        );


        setProgress(
            100,
            "送信完了！"
        );


        setStatus(
            "🟢 送信完了"
        );


    } catch (error) {

        log(
            "× 送信エラー: " +
            error.message
        );


        setStatus(
            "🔴 送信エラー"
        );


    } finally {

        document.getElementById(
            "sendButton"
        ).disabled = false;
    }

}


/* =========================================================
   1枚のファイルを送信
========================================================= */

async function sendSingleFile(
    file,
    fileIndex,
    totalFiles
) {

    /*
     * ファイル情報
     */

    dataChannel.send(
        JSON.stringify({

            type:
                "file-info",

            name:
                file.name,

            size:
                file.size,

            mime:
                file.type,

            fileIndex:
                fileIndex,

            totalFiles:
                totalFiles

        })
    );


    const buffer =
        await file.arrayBuffer();


    const chunkSize =
        16 * 1024;


    let offset = 0;


    while (
        offset <
        buffer.byteLength
    ) {

        const chunk =
            buffer.slice(
                offset,
                Math.min(
                    offset +
                    chunkSize,

                    buffer.byteLength
                )
            );


        dataChannel.send(
            chunk
        );


        offset +=
            chunk.byteLength;


        /*
         * 現在の画像の進捗
         */

        const filePercent =
            Math.floor(
                offset /
                buffer.byteLength *
                100
            );


        /*
         * 全体の進捗
         */

        const totalPercent =
            Math.floor(
                (
                    fileIndex +
                    offset /
                    buffer.byteLength
                )
                /
                totalFiles *
                100
            );


        setProgress(
            totalPercent,

            `${fileIndex + 1}/${totalFiles}枚目 ` +
            `${filePercent}%`
        );


        /*
         * バッファが膨らみすぎないようにする
         */

        if (
            dataChannel.bufferedAmount >
            1024 * 1024
        ) {

            await waitForBuffer();
        }
    }


    /*
     * この画像の終了
     */

    dataChannel.send(
        JSON.stringify({

            type:
                "file-end"

        })
    );


    log(
        `✓ ${file.name} 送信完了`
    );


    /*
     * 次のファイルに進む前に
     * 少し待つ
     */

    await sleep(100);
}


/* =========================================================
   DataChannelバッファ待ち
========================================================= */

function waitForBuffer() {

    return new Promise(
        resolve => {

            const check =
                () => {

                    if (
                        dataChannel.bufferedAmount <
                        256 * 1024
                    ) {

                        resolve();

                    } else {

                        setTimeout(
                            check,
                            20
                        );
                    }
                };


            check();
        }
    );
}


/* =========================================================
   待機
========================================================= */

function sleep(ms) {

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );
}


/* =========================================================
   進捗表示
========================================================= */

function setProgress(
    percent,
    text
) {

    document.getElementById(
        "progressBar"
    ).style.width =
        percent + "%";


    document.getElementById(
        "progressText"
    ).textContent =
        text;
}


/* =========================================================
   データ受信
========================================================= */

function handleDataMessage(
    data
) {

    /*
     * 文字列
     */

    if (
        typeof data ===
        "string"
    ) {

        try {

            const message =
                JSON.parse(data);


            /* --------------------------------
               ファイル開始
            -------------------------------- */

            if (
                message.type ===
                "file-info"
            ) {

                receiveBuffers = [];

                receiveSize = 0;

                receiveFileName =
                    message.name;

                receiveFileType =
                    message.mime;

                receiveFileSize =
                    message.size;


                log(
                    `📥 [${message.fileIndex + 1}/${message.totalFiles}] ` +
                    `${receiveFileName} 受信開始`
                );


                setStatus(
                    "📥 画像受信中..."
                );
            }


            /* --------------------------------
               ファイル終了
            -------------------------------- */

            else if (
                message.type ===
                "file-end"
            ) {

                finishReceive();
            }


        } catch (error) {

            log(
                "文字列データ受信: " +
                data
            );
        }


        return;
    }


    /*
     * バイナリデータ
     */

    if (
        data instanceof ArrayBuffer
    ) {

        receiveBuffers.push(
            data
        );


        receiveSize +=
            data.byteLength;


        const percent =
            receiveFileSize
                ? Math.floor(
                    receiveSize /
                    receiveFileSize *
                    100
                )
                : 0;


        setStatus(
            `📥 ${receiveFileName} ` +
            `${percent}%`
        );
    }

}


/* =========================================================
   受信完了
========================================================= */

function finishReceive() {

    const blob =
        new Blob(
            receiveBuffers,
            {
                type:
                    receiveFileType ||
                    "image/jpeg"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    /*
     * 受信画像エリア
     */

    const container =
        document.getElementById(
            "received"
        );


    /*
     * 「まだ受信していません」を消す
     */

    document.getElementById(
        "noReceived"
    ).style.display =
        "none";


    /*
     * 画像カード
     */

    const item =
        document.createElement(
            "div"
        );

    item.className =
        "received-item";


    /*
     * 画像
     */

    const img =
        document.createElement(
            "img"
        );


    img.src =
        url;


    img.alt =
        receiveFileName;


    /*
     * ファイル名
     */

    const name =
        document.createElement(
            "div"
        );


    name.className =
        "received-name";


    name.textContent =
        receiveFileName;


    /*
     * ダウンロードボタン
     */

    const downloadButton =
        document.createElement(
            "button"
        );


    downloadButton.className =
        "download-button";


    downloadButton.textContent =
        "📥 ダウンロード";


    downloadButton.onclick =
        () => {

            downloadFile(
                blob,
                receiveFileName
            );
        };


    /*
     * カードに追加
     */

    item.appendChild(
        img
    );

    item.appendChild(
        name
    );

    item.appendChild(
        downloadButton
    );


    container.appendChild(
        item
    );


    log(
        "🎉 " +
        receiveFileName +
        " の受信完了！"
    );


    log(
        "受信サイズ: " +
        formatFileSize(
            receiveSize
        )
    );


    setStatus(
        "🟢 画像受信完了"
    );


    /*
     * 次の画像を受信できるように
     * リセット
     */

    receiveBuffers = [];

    receiveSize = 0;

    receiveFileName = "";

    receiveFileType = "";

    receiveFileSize = 0;
}


/* =========================================================
   ダウンロード
========================================================= */

function downloadFile(
    blob,
    fileName
) {

    const url =
        URL.createObjectURL(
            blob
        );


    const a =
        document.createElement(
            "a"
        );


    a.href =
        url;


    a.download =
        fileName;


    document.body.appendChild(
        a
    );


    a.click();


    a.remove();


    /*
     * 少し待ってURLを解放
     */

    setTimeout(
        () => {

            URL.revokeObjectURL(
                url
            );

        },
        1000
    );


    log(
        "📥 ダウンロード: " +
        fileName
    );
}
