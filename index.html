<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>RikuDrop</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background:
    linear-gradient(
      135deg,
      #eef4ff,
      #f8f9ff
    );

  color: #222;
}

.container {
  width: min(900px, 94%);
  margin: 30px auto;
}

header {
  text-align: center;
  margin-bottom: 25px;
}

.logo {
  font-size: 38px;
  font-weight: 800;
}

.subtitle {
  color: #666;
  margin-top: 5px;
}

.card {
  background: white;
  border-radius: 22px;
  padding: 25px;
  margin-bottom: 20px;

  box-shadow:
    0 10px 30px
    rgba(0, 0, 0, 0.08);
}

.hidden {
  display: none !important;
}


/* =========================
   色選択
========================= */

.color-grid {
  display: grid;

  grid-template-columns:
    repeat(2, 1fr);

  gap: 15px;

  margin-top: 20px;
}

.color-button {
  border: none;
  border-radius: 18px;

  min-height: 110px;

  font-size: 28px;
  font-weight: bold;

  color: white;

  cursor: pointer;

  transition:
    transform .15s,
    box-shadow .15s;
}

.color-button:hover {
  transform: translateY(-3px);

  box-shadow:
    0 8px 20px
    rgba(0, 0, 0, .15);
}

.color-button:active {
  transform: scale(.97);
}

.red {
  background: #ef4444;
}

.orange {
  background: #f97316;
}

.yellow {
  background: #eab308;
}

.green {
  background: #22c55e;
}

.blue {
  background: #3b82f6;
}

.purple {
  background: #8b5cf6;
}


/* =========================
   ステータス
========================= */

.status {
  text-align: center;

  padding: 25px;

  border-radius: 18px;

  background: #f5f7fb;
}

.status-icon {
  font-size: 45px;
  margin-bottom: 10px;
}

.status-title {
  font-size: 22px;
  font-weight: bold;
}

.status-text {
  margin-top: 8px;
  color: #666;
}


/* =========================
   ファイル選択
========================= */

.file-select {
  width: 100%;

  padding: 18px;

  border-radius: 14px;

  border: 2px dashed #bbb;

  background: #fafafa;

  cursor: pointer;

  text-align: center;

  font-size: 17px;
}

.file-select:hover {
  background: #f2f5ff;
}

.file-select input {
  display: none;
}


/* =========================
   ファイル一覧
========================= */

.file-list {
  margin-top: 15px;
}

.file-item {
  display: flex;

  align-items: center;

  gap: 12px;

  padding: 12px;

  border-radius: 12px;

  background: #f5f6fa;

  margin-bottom: 8px;
}

.file-icon {
  font-size: 28px;
}

.file-info {
  flex: 1;

  min-width: 0;
}

.file-name {
  font-weight: 600;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;
}

.file-size {
  color: #777;

  font-size: 13px;

  margin-top: 3px;
}

.remove-file {
  border: none;

  background: #e5e7eb;

  border-radius: 50%;

  width: 34px;
  height: 34px;

  cursor: pointer;

  font-size: 18px;
}

.remove-file:hover {
  background: #d1d5db;
}


/* =========================
   ボタン
========================= */

.button-row {
  display: flex;

  gap: 10px;

  margin-top: 15px;

  flex-wrap: wrap;
}

button.action {
  border: none;

  border-radius: 12px;

  padding: 13px 20px;

  font-size: 16px;

  cursor: pointer;

  font-weight: 600;
}

.primary {
  background: #2563eb;
  color: white;
}

.primary:hover {
  background: #1d4ed8;
}

.secondary {
  background: #e5e7eb;
  color: #222;
}

.secondary:hover {
  background: #d1d5db;
}

.danger {
  background: #fee2e2;
  color: #b91c1c;
}


/* =========================
   プログレス
========================= */

.progress-area {
  margin-top: 20px;
}

.progress-label {
  display: flex;

  justify-content: space-between;

  margin-bottom: 6px;

  font-size: 14px;
}

.progress {
  height: 12px;

  background: #e5e7eb;

  border-radius: 999px;

  overflow: hidden;
}

.progress-bar {
  width: 0%;

  height: 100%;

  background: #2563eb;

  transition: width .15s;
}


/* =========================
   受信ファイル
========================= */

.received-item {
  display: flex;

  align-items: center;

  gap: 15px;

  padding: 15px;

  background: #f5f6fa;

  border-radius: 15px;

  margin-bottom: 10px;
}

.received-preview {
  width: 75px;
  height: 75px;

  object-fit: cover;

  border-radius: 10px;

  background: #ddd;
}

.received-icon {
  width: 75px;
  height: 75px;

  display: flex;

  align-items: center;
  justify-content: center;

  font-size: 40px;

  background: #e9edf5;

  border-radius: 10px;
}

.received-info {
  flex: 1;

  min-width: 0;
}

.received-name {
  font-weight: bold;

  overflow: hidden;

  text-overflow: ellipsis;

  white-space: nowrap;
}

.received-size {
  color: #777;

  font-size: 13px;

  margin-top: 4px;
}

.download-button {
  border: none;

  background: #2563eb;

  color: white;

  padding: 10px 14px;

  border-radius: 10px;

  cursor: pointer;

  white-space: nowrap;
}


/* =========================
   接続情報
========================= */

.connection-info {
  text-align: center;

  color: #666;

  font-size: 14px;

  margin-top: 12px;
}


/* =========================
   スマホ
========================= */

@media (max-width: 600px) {

  .container {
    margin: 15px auto;
  }

  .logo {
    font-size: 32px;
  }

  .card {
    padding: 18px;
  }

  .color-grid {
    grid-template-columns:
      repeat(2, 1fr);
  }

  .color-button {
    min-height: 95px;
    font-size: 24px;
  }

  .received-item {
    flex-wrap: wrap;
  }

  .download-button {
    width: 100%;
  }
}

</style>
</head>


<body>

<div class="container">

<header>

  <div class="logo">
    📦 RikuDrop
  </div>

  <div class="subtitle">
    かんたんファイル送受信
  </div>

</header>


<!-- =========================
     色選択画面
========================= -->

<section
  id="pairingCard"
  class="card"
>

  <div class="status">

    <div class="status-icon">
      🎨
    </div>

    <div class="status-title">
      同じ色を2台で選んでください
    </div>

    <div class="status-text">
      スマホとPCのどちらからでもOKです
    </div>

  </div>


  <div class="color-grid">

    <button
      class="color-button red"
      data-color="red"
    >
      🔴<br>
      赤
    </button>

    <button
      class="color-button orange"
      data-color="orange"
    >
      🟠<br>
      オレンジ
    </button>

    <button
      class="color-button yellow"
      data-color="yellow"
    >
      🟡<br>
      黄色
    </button>

    <button
      class="color-button green"
      data-color="green"
    >
      🟢<br>
      緑
    </button>

    <button
      class="color-button blue"
      data-color="blue"
    >
      🔵<br>
      青
    </button>

    <button
      class="color-button purple"
      data-color="purple"
    >
      🟣<br>
      紫
    </button>

  </div>

</section>


<!-- =========================
     待機画面
========================= -->

<section
  id="waitingCard"
  class="card hidden"
>

  <div class="status">

    <div class="status-icon">
      ⏳
    </div>

    <div
      id="waitingTitle"
      class="status-title"
    >
      相手を探しています…
    </div>

    <div
      id="waitingText"
      class="status-text"
    >
      同じ色を選んだ端末を待っています
    </div>

  </div>

  <div
    id="selectedColorText"
    class="connection-info"
  ></div>

  <div class="button-row">

    <button
      id="cancelPairButton"
      class="action secondary"
    >
      キャンセル
    </button>

  </div>

</section>


<!-- =========================
     接続後
========================= -->

<section
  id="mainCard"
  class="card hidden"
>

  <div class="status">

    <div class="status-icon">
      🟢
    </div>

    <div class="status-title">
      接続しました！
    </div>

    <div class="status-text">
      この画面からどちらの端末にも送信できます
    </div>

  </div>

  <div
    id="connectionInfo"
    class="connection-info"
  ></div>

</section>


<!-- =========================
     ファイル送信
========================= -->

<section
  id="sendCard"
  class="card hidden"
>

  <h2>
    📤 ファイルを送る
  </h2>

  <label class="file-select">

    <input
      id="fileInput"
      type="file"
      multiple
    >

    📁 ファイルを選択

  </label>


  <div
    id="fileList"
    class="file-list"
  ></div>


  <div class="button-row">

    <button
      id="clearFilesButton"
      class="action secondary"
    >
      選択をすべて解除
    </button>

    <button
      id="sendButton"
      class="action primary"
    >
      🚀 送信
    </button>

  </div>


  <div
    id="progressArea"
    class="progress-area hidden"
  >

    <div class="progress-label">

      <span id="progressName">
        送信中…
      </span>

      <span id="progressPercent">
        0%
      </span>

    </div>

    <div class="progress">

      <div
        id="progressBar"
        class="progress-bar"
      ></div>

    </div>

  </div>

</section>


<!-- =========================
     受信
========================= -->

<section
  id="receiveCard"
  class="card hidden"
>

  <h2>
    📥 受信したファイル
  </h2>

  <div id="receivedList">

    <div
      id="noReceived"
      class="connection-info"
    >
      まだファイルを受信していません
    </div>

  </div>

</section>


</div>


<script>

"use strict";


/* ========================================
   設定
======================================== */

const WORKER_URL =
  "https://ancient-wind-96c6.rikuhira115.workers.dev";


const ICE_SERVERS = [

  {
    urls:
      "stun:stun.cloudflare.com:3478"
  }

];


const CHUNK_SIZE =
  16 * 1024;


/* ========================================
   状態
======================================== */

let socket = null;

let peerConnection = null;

let dataChannel = null;

let selectedColor = null;

let selectedFiles = [];

let peerRole = null;

let connected = false;

let pendingCandidates = [];

let incomingFile = null;


/* ========================================
   DOM
======================================== */

const pairingCard =
  document.getElementById(
    "pairingCard"
  );

const waitingCard =
  document.getElementById(
    "waitingCard"
  );

const mainCard =
  document.getElementById(
    "mainCard"
  );

const sendCard =
  document.getElementById(
    "sendCard"
  );

const receiveCard =
  document.getElementById(
    "receiveCard"
  );

const fileInput =
  document.getElementById(
    "fileInput"
  );

const fileList =
  document.getElementById(
    "fileList"
  );

const receivedList =
  document.getElementById(
    "receivedList"
  );

const sendButton =
  document.getElementById(
    "sendButton"
  );

const clearFilesButton =
  document.getElementById(
    "clearFilesButton"
  );

const cancelPairButton =
  document.getElementById(
    "cancelPairButton"
  );

const progressArea =
  document.getElementById(
    "progressArea"
  );

const progressBar =
  document.getElementById(
    "progressBar"
  );

const progressName =
  document.getElementById(
    "progressName"
  );

const progressPercent =
  document.getElementById(
    "progressPercent"
  );


/* ========================================
   色ボタン
======================================== */

document
  .querySelectorAll(".color-button")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        const color =
          button.dataset.color;

        startPairing(color);

      }
    );

  });


/* ========================================
   ペアリング開始
======================================== */

function startPairing(color) {

  selectedColor = color;

  pairingCard.classList.add(
    "hidden"
  );

  waitingCard.classList.remove(
    "hidden"
  );

  selectedColorText.textContent =
    `選択中：${colorName(color)}`;

  console.log(
    "ペアリング開始:",
    color
  );


  const wsUrl =
    WORKER_URL
      .replace(/^http/, "ws")
      + `/pair?color=${encodeURIComponent(color)}`;


  socket =
    new WebSocket(wsUrl);


  socket.onopen = () => {

    console.log(
      "✓ Cloudflare WebSocket接続成功"
    );

  };


  socket.onmessage =
    async event => {

      try {

        const message =
          JSON.parse(event.data);

        await handleSignalingMessage(
          message
        );

      } catch (error) {

        console.error(
          "WebSocketメッセージエラー:",
          error
        );

      }

    };


  socket.onerror = error => {

    console.error(
      "WebSocketエラー:",
      error
    );

    showPairingError(
      "サーバーとの通信に失敗しました"
    );

  };


  socket.onclose = () => {

    console.log(
      "WebSocket切断"
    );

  };

}


/* ========================================
   色名
======================================== */

function colorName(color) {

  const names = {

    red: "🔴 赤",

    orange: "🟠 オレンジ",

    yellow: "🟡 黄色",

    green: "🟢 緑",

    blue: "🔵 青",

    purple: "🟣 紫"

  };

  return names[color] || color;

}


/* ========================================
   シグナリング
======================================== */

async function handleSignalingMessage(
  message
) {

  console.log(
    "シグナリング:",
    message
  );


  if (
    message.type === "waiting"
  ) {

    document
      .getElementById(
        "waitingTitle"
      )
      .textContent =
      "相手を探しています…";

    document
      .getElementById(
        "waitingText"
      )
      .textContent =
      "もう1台で同じ色を選んでください";

    return;
  }


  if (
    message.type === "paired"
  ) {

    peerRole =
      message.role;

    document
      .getElementById(
        "waitingTitle"
      )
      .textContent =
      "2台を接続しています…";

    document
      .getElementById(
        "waitingText"
      )
      .textContent =
      "WebRTC接続を準備しています";

    await createPeerConnection();

    if (
      peerRole === "offerer"
    ) {

      await createOffer();

    }

    return;
  }


  if (
    message.type === "offer"
  ) {

    await handleOffer(
      message.offer
    );

    return;
  }


  if (
    message.type === "answer"
  ) {

    await handleAnswer(
      message.answer
    );

    return;
  }


  if (
    message.type === "candidate"
  ) {

    await handleCandidate(
      message.candidate
    );

    return;
  }


  if (
    message.type === "peer-left"
  ) {

    disconnectPeer(
      "相手の端末が切断しました"
    );

  }

}


/* ========================================
   WebRTC作成
======================================== */

async function createPeerConnection() {

  if (peerConnection) {
    return;
  }


  peerConnection =
    new RTCPeerConnection({
      iceServers:
        ICE_SERVERS
    });


  peerConnection.onicecandidate =
    event => {

      if (
        event.candidate
      ) {

        sendSignal({

          type: "candidate",

          candidate:
            event.candidate

        });

      }

    };


  peerConnection.oniceconnectionstatechange =
    () => {

      console.log(
        "ICE状態:",
        peerConnection.iceConnectionState
      );

    };


  peerConnection.onconnectionstatechange =
    () => {

      console.log(
        "WebRTC状態:",
        peerConnection.connectionState
      );


      if (
        peerConnection.connectionState ===
        "connected"
      ) {

        connected = true;

        showConnected();

      }


      if (
        peerConnection.connectionState ===
        "failed"
      ) {

        showPairingError(
          "WebRTC接続に失敗しました。別のWi-Fiで試してください。"
        );

      }

    };


  /*
   * Offerer側
   */
  if (
    peerRole === "offerer"
  ) {

    dataChannel =
      peerConnection.createDataChannel(
        "RikuDropFiles",
        {
          ordered: true
        }
      );

    setupDataChannel(
      dataChannel
    );

  }


  /*
   * Answerer側
   */
  peerConnection.ondatachannel =
    event => {

      dataChannel =
        event.channel;

      setupDataChannel(
        dataChannel
      );

    };

}


/* ========================================
   DataChannel
======================================== */

function setupDataChannel(
  channel
) {

  channel.binaryType =
    "arraybuffer";


  channel.bufferedAmountLowThreshold =
    512 * 1024;


  channel.onopen = () => {

    console.log(
      "✓ DataChannel接続成功"
    );

    showConnected();

  };


  channel.onclose = () => {

    console.log(
      "DataChannel切断"
    );

  };


  channel.onerror = error => {

    console.error(
      "DataChannelエラー:",
      error
    );

  };


  channel.onmessage =
    event => {

      handleDataMessage(
        event.data
      );

    };

}


/* ========================================
   Offer作成
======================================== */

async function createOffer() {

  const offer =
    await peerConnection.createOffer();

  await peerConnection.setLocalDescription(
    offer
  );


  sendSignal({

    type: "offer",

    offer:
      peerConnection.localDescription

  });

}


/* ========================================
   Offer受信
======================================== */

async function handleOffer(
  offer
) {

  await peerConnection.setRemoteDescription(
    new RTCSessionDescription(
      offer
    )
  );


  await flushCandidates();


  const answer =
    await peerConnection.createAnswer();

  await peerConnection.setLocalDescription(
    answer
  );


  sendSignal({

    type: "answer",

    answer:
      peerConnection.localDescription

  });

}


/* ========================================
   Answer受信
======================================== */

async function handleAnswer(
  answer
) {

  await peerConnection.setRemoteDescription(
    new RTCSessionDescription(
      answer
    )
  );


  await flushCandidates();

}


/* ========================================
   ICE Candidate
======================================== */

async function handleCandidate(
  candidate
) {

  if (
    peerConnection &&
    peerConnection.remoteDescription
  ) {

    try {

      await peerConnection.addIceCandidate(
        candidate
      );

    } catch (error) {

      console.error(
        "ICE候補エラー:",
        error
      );

    }

  } else {

    pendingCandidates.push(
      candidate
    );

  }

}


/* ========================================
   保留中ICE候補
======================================== */

async function flushCandidates() {

  for (
    const candidate
    of pendingCandidates
  ) {

    try {

      await peerConnection.addIceCandidate(
        candidate
      );

    } catch (error) {

      console.error(
        "ICE候補追加エラー:",
        error
      );

    }

  }

  pendingCandidates = [];

}


/* ========================================
   シグナル送信
======================================== */

function sendSignal(
  message
) {

  if (
    socket &&
    socket.readyState ===
    WebSocket.OPEN
  ) {

    socket.send(
      JSON.stringify(message)
    );

  }

}


/* ========================================
   接続成功画面
======================================== */

function showConnected() {

  if (
    !dataChannel ||
    dataChannel.readyState !== "open"
  ) {
    return;
  }


  connected = true;


  pairingCard.classList.add(
    "hidden"
  );

  waitingCard.classList.add(
    "hidden"
  );

  mainCard.classList.remove(
    "hidden"
  );

  sendCard.classList.remove(
    "hidden"
  );

  receiveCard.classList.remove(
    "hidden"
  );


  document
    .getElementById(
      "connectionInfo"
    )
    .textContent =
    `接続方式：WebRTC / ${colorName(selectedColor)}`;

}


/* ========================================
   ファイル選択
======================================== */

fileInput.addEventListener(
  "change",
  () => {

    const files =
      Array.from(
        fileInput.files
      );

    selectedFiles.push(
      ...files
    );

    renderSelectedFiles();

    fileInput.value = "";

  }
);


/* ========================================
   ファイル一覧表示
======================================== */

function renderSelectedFiles() {

  fileList.innerHTML = "";


  if (
    selectedFiles.length === 0
  ) {

    fileList.innerHTML =
      `<div class="connection-info">
        送信するファイルはありません
      </div>`;

    return;

  }


  selectedFiles.forEach(
    (file, index) => {

      const item =
        document.createElement(
          "div"
        );

      item.className =
        "file-item";


      const icon =
        document.createElement(
          "div"
        );

      icon.className =
        "file-icon";

      icon.textContent =
        getFileIcon(file);


      const info =
        document.createElement(
          "div"
        );

      info.className =
        "file-info";


      const name =
        document.createElement(
          "div"
        );

      name.className =
        "file-name";

      name.textContent =
        file.name;


      const size =
        document.createElement(
          "div"
        );

      size.className =
        "file-size";

      size.textContent =
        formatBytes(
          file.size
        );


      info.appendChild(
        name
      );

      info.appendChild(
        size
      );


      const remove =
        document.createElement(
          "button"
        );

      remove.className =
        "remove-file";

      remove.textContent =
        "×";

      remove.title =
        "このファイルを削除";


      remove.addEventListener(
        "click",
        () => {

          selectedFiles.splice(
            index,
            1
          );

          renderSelectedFiles();

        }
      );


      item.appendChild(
        icon
      );

      item.appendChild(
        info
      );

      item.appendChild(
        remove
      );


      fileList.appendChild(
        item
      );

    }
  );

}


/* ========================================
   ファイルアイコン
======================================== */

function getFileIcon(file) {

  const type =
    file.type || "";


  if (
    type.startsWith("image/")
  ) {
    return "🖼️";
  }


  if (
    type.startsWith("video/")
  ) {
    return "🎥";
  }


  if (
    type.startsWith("audio/")
  ) {
    return "🎵";
  }


  if (
    type === "application/pdf"
  ) {
    return "📕";
  }


  if (
    file.name
      .toLowerCase()
      .endsWith(".zip")
  ) {
    return "📦";
  }


  if (
    type.includes("word") ||
    file.name
      .toLowerCase()
      .match(/\.(doc|docx)$/)
  ) {
    return "📝";
  }


  if (
    type.includes("sheet") ||
    file.name
      .toLowerCase()
      .match(/\.(xls|xlsx)$/)
  ) {
    return "📊";
  }


  return "📄";

}


/* ========================================
   ファイル全解除
======================================== */

clearFilesButton.addEventListener(
  "click",
  () => {

    selectedFiles = [];

    renderSelectedFiles();

  }
);


/* ========================================
   送信
======================================== */

sendButton.addEventListener(
  "click",
  async () => {

    if (
      !connected ||
      !dataChannel ||
      dataChannel.readyState !== "open"
    ) {

      alert(
        "まだ接続されていません"
      );

      return;

    }


    if (
      selectedFiles.length === 0
    ) {

      alert(
        "送信するファイルを選択してください"
      );

      return;

    }


    sendButton.disabled = true;

    clearFilesButton.disabled = true;

    progressArea.classList.remove(
      "hidden"
    );


    try {

      /*
       * コピーしておく
       */
      const files =
        [...selectedFiles];


      for (
        let i = 0;
        i < files.length;
        i++
      ) {

        await sendFile(
          files[i],
          i + 1,
          files.length
        );

      }


      progressName.textContent =
        "送信完了";

      progressPercent.textContent =
        "100%";

      progressBar.style.width =
        "100%";


      setTimeout(
        () => {

          progressArea.classList.add(
            "hidden"
          );

        },
        1500
      );


    } catch (error) {

      console.error(
        "ファイル送信エラー:",
        error
      );

      alert(
        "ファイルの送信に失敗しました"
      );

    } finally {

      sendButton.disabled = false;

      clearFilesButton.disabled = false;

    }

  }
);


/* ========================================
   1ファイル送信
======================================== */

async function sendFile(
  file,
  index,
  total
) {

  const fileId =
    crypto.randomUUID();


  /*
   * ファイル情報を先に送る
   */
  dataChannel.send(
    JSON.stringify({

      type: "file-start",

      id: fileId,

      name: file.name,

      size: file.size,

      mime:
        file.type ||
        "application/octet-stream"

    })
  );


  progressName.textContent =
    `${file.name} (${index}/${total})`;

  progressPercent.textContent =
    "0%";

  progressBar.style.width =
    "0%";


  let offset = 0;


  while (
    offset < file.size
  ) {

    /*
     * DataChannelのバッファが
     * 大きくなりすぎないように待つ
     */
    await waitForBuffer();


    const end =
      Math.min(
        offset + CHUNK_SIZE,
        file.size
      );


    const blob =
      file.slice(
        offset,
        end
      );


    const buffer =
      await blob.arrayBuffer();


    dataChannel.send(
      buffer
    );


    offset = end;


    const percent =
      file.size === 0
        ? 100
        : Math.floor(
            (offset /
              file.size) *
            100
          );


    progressPercent.textContent =
      `${percent}%`;

    progressBar.style.width =
      `${percent}%`;


    /*
     * UIを固めない
     */
    await new Promise(
      resolve =>
        setTimeout(
          resolve,
          0
        )
    );

  }


  /*
   * ファイル終了
   */
  dataChannel.send(
    JSON.stringify({

      type: "file-end",

      id: fileId

    })
  );

}


/* ========================================
   DataChannelバッファ待ち
======================================== */

function waitForBuffer() {

  return new Promise(
    resolve => {

      if (
        dataChannel.bufferedAmount
        < 1024 * 1024
      ) {

        resolve();

        return;

      }


      const check =
        () => {

          if (
            !dataChannel ||
            dataChannel.readyState !==
              "open"
          ) {

            resolve();

            return;

          }


          if (
            dataChannel.bufferedAmount
            < 512 * 1024
          ) {

            resolve();

          } else {

            setTimeout(
              check,
              20
            );

          }

        };


      check();

    }
  );

}


/* ========================================
   受信データ
======================================== */

function handleDataMessage(
  data
) {

  /*
   * JSONメッセージ
   */
  if (
    typeof data === "string"
  ) {

    let message;

    try {

      message =
        JSON.parse(data);

    } catch (error) {

      return;

    }


    if (
      message.type ===
      "file-start"
    ) {

      incomingFile = {

        id:
          message.id,

        name:
          message.name,

        size:
          message.size,

        mime:
          message.mime,

        chunks: [],

        received: 0

      };


      console.log(
        "受信開始:",
        message.name
      );


      return;

    }


    if (
      message.type ===
      "file-end"
    ) {

      finishIncomingFile();

      return;

    }

    return;

  }


  /*
   * バイナリデータ
   */
  if (
    data instanceof ArrayBuffer
  ) {

    receiveChunk(
      data
    );

    return;

  }


  if (
    data instanceof Blob
  ) {

    data.arrayBuffer()
      .then(
        buffer =>
          receiveChunk(
            buffer
          )
      );

  }

}


/* ========================================
   受信チャンク
======================================== */

function receiveChunk(
  buffer
) {

  if (!incomingFile) {
    return;
  }


  incomingFile.chunks.push(
    buffer
  );

  incomingFile.received +=
    buffer.byteLength;


  /*
   * 受信進捗を表示
   */
  const percent =
    incomingFile.size === 0
      ? 100
      : Math.floor(
          (
            incomingFile.received /
            incomingFile.size
          ) * 100
        );


  console.log(
    `受信中 ${percent}%`
  );

}


/* ========================================
   ファイル完成
======================================== */

function finishIncomingFile() {

  if (!incomingFile) {
    return;
  }


  const file =
    new File(
      incomingFile.chunks,

      incomingFile.name,

      {
        type:
          incomingFile.mime
      }
    );


  addReceivedFile(
    file
  );


  console.log(
    "受信完了:",
    file.name
  );


  incomingFile = null;

}


/* ========================================
   受信ファイル表示
======================================== */

function addReceivedFile(
  file
) {

  const noReceived =
    document.getElementById(
      "noReceived"
    );


  if (noReceived) {
    noReceived.remove();
  }


  const item =
    document.createElement(
      "div"
    );

  item.className =
    "received-item";


  /*
   * 画像ならプレビュー
   */
  if (
    file.type.startsWith(
      "image/"
    )
  ) {

    const img =
      document.createElement(
        "img"
      );

    img.className =
      "received-preview";

    const url =
      URL.createObjectURL(
        file
      );

    img.src = url;

    img.onload = () => {
      URL.revokeObjectURL(url);
    };


    item.appendChild(
      img
    );

  } else {

    const icon =
      document.createElement(
        "div"
      );

    icon.className =
      "received-icon";

    icon.textContent =
      getFileIcon(file);


    item.appendChild(
      icon
    );

  }


  const info =
    document.createElement(
      "div"
    );

  info.className =
    "received-info";


  const name =
    document.createElement(
      "div"
    );

  name.className =
    "received-name";

  name.textContent =
    file.name;


  const size =
    document.createElement(
      "div"
    );

  size.className =
    "received-size";

  size.textContent =
    formatBytes(
      file.size
    );


  info.appendChild(
    name
  );

  info.appendChild(
    size
  );


  const download =
    document.createElement(
      "button"
    );

  download.className =
    "download-button";

  download.textContent =
    "📥 ダウンロード";


  download.addEventListener(
    "click",
    () => {

      downloadFile(
        file
      );

    }
  );


  item.appendChild(
    info
  );

  item.appendChild(
    download
  );


  receivedList.prepend(
    item
  );

}


/* ========================================
   ダウンロード
======================================== */

function downloadFile(
  file
) {

  const url =
    URL.createObjectURL(
      file
    );


  const a =
    document.createElement(
      "a"
    );

  a.href =
    url;

  a.download =
    file.name;


  document.body.appendChild(
    a
  );

  a.click();

  a.remove();


  setTimeout(
    () => {

      URL.revokeObjectURL(
        url
      );

    },
    1000
  );

}


/* ========================================
   サイズ表示
======================================== */

function formatBytes(
  bytes
) {

  if (
    bytes === 0
  ) {
    return "0 B";
  }


  const units = [
    "B",
    "KB",
    "MB",
    "GB",
    "TB"
  ];


  const index =
    Math.floor(
      Math.log(bytes) /
      Math.log(1024)
    );


  return (
    bytes /
    Math.pow(
      1024,
      index
    )
  ).toFixed(
    index === 0 ? 0 : 1
  )
  + " "
  + units[index];

}


/* ========================================
   ペアリングキャンセル
======================================== */

cancelPairButton.addEventListener(
  "click",
  () => {

    disconnectAll();

    pairingCard.classList.remove(
      "hidden"
    );

    waitingCard.classList.add(
      "hidden"
    );

  }
);


/* ========================================
   エラー表示
======================================== */

function showPairingError(
  message
) {

  document
    .getElementById(
      "waitingTitle"
    )
    .textContent =
    "⚠️ 接続できませんでした";

  document
    .getElementById(
      "waitingText"
    )
    .textContent =
    message;

}


/* ========================================
   切断
======================================== */

function disconnectPeer(
  message
) {

  connected = false;

  if (peerConnection) {

    try {
      peerConnection.close();
    } catch (error) {}

  }

  peerConnection = null;

  dataChannel = null;

  pendingCandidates = [];


  mainCard.classList.add(
    "hidden"
  );

  sendCard.classList.add(
    "hidden"
  );

  receiveCard.classList.add(
    "hidden"
  );


  waitingCard.classList.remove(
    "hidden"
  );


  document
    .getElementById(
      "waitingTitle"
    )
    .textContent =
    message;

}


function disconnectAll() {

  try {

    if (socket) {
      socket.close();
    }

  } catch (error) {}


  try {

    if (dataChannel) {
      dataChannel.close();
    }

  } catch (error) {}


  try {

    if (peerConnection) {
      peerConnection.close();
    }

  } catch (error) {}


  socket = null;

  dataChannel = null;

  peerConnection = null;

  connected = false;

  pendingCandidates = [];

}


/* ========================================
   初期表示
======================================== */

renderSelectedFiles();

</script>
