<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>RikuDrop</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background: #f4f7fb;
    color: #222;
}

.container {
    width: min(900px, 92%);
    margin: 30px auto;
}

h1 {
    text-align: center;
    margin-bottom: 5px;
}

.subtitle {
    text-align: center;
    color: #666;
    margin-bottom: 25px;
}

.card {
    background: white;
    border-radius: 18px;
    padding: 22px;
    margin-bottom: 18px;

    box-shadow:
        0 5px 20px rgba(0,0,0,0.08);
}

h2 {
    margin-top: 0;
}

.room-area {
    display: flex;
    gap: 10px;
}

.room-area input {
    flex: 1;

    padding: 13px;

    font-size: 16px;

    border:
        1px solid #ccc;

    border-radius: 10px;
}

.role-buttons {
    display: flex;
    gap: 12px;
}

button {
    border: none;

    border-radius: 10px;

    padding:
        13px 20px;

    font-size: 15px;

    cursor: pointer;

    color: white;

    background: #222;
}

button:hover {
    opacity: 0.85;
}

button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

.windows {
    flex: 1;
    background: #2563eb;
}

.iphone {
    flex: 1;
    background: #16a34a;
}

.connection-state {
    text-align: center;

    font-size: 20px;

    font-weight: bold;

    padding: 15px;

    border-radius: 12px;

    background: #eee;

    margin-bottom: 15px;
}

.connected {
    background: #dcfce7;
    color: #166534;
}

.connecting {
    background: #fef3c7;
    color: #92400e;
}

.failed {
    background: #fee2e2;
    color: #991b1b;
}

.status {
    background: #111827;

    color: #d1fae5;

    border-radius: 12px;

    padding: 15px;

    height: 360px;

    overflow-y: auto;

    font-family: monospace;

    font-size: 13px;

    line-height: 1.6;

    white-space: pre-wrap;
}

.file-area {
    display: flex;

    gap: 10px;

    flex-wrap: wrap;

    align-items: center;
}

.file-area input {
    flex: 1;
}

.progress {
    margin-top: 15px;

    height: 12px;

    background: #ddd;

    border-radius: 10px;

    overflow: hidden;
}

.progress-bar {
    height: 100%;

    width: 0%;

    background: #2563eb;

    transition: width 0.1s;
}

.received img {
    max-width: 100%;

    max-height: 400px;

    border-radius: 12px;

    display: block;

    margin-top: 10px;
}

.small {
    color: #666;

    font-size: 13px;
}

@media (max-width: 600px) {

    .container {
        margin: 15px auto;
    }

    .role-buttons {
        flex-direction: column;
    }

    .room-area {
        flex-direction: column;
    }

    .card {
        padding: 17px;
    }

}

</style>

</head>


<body>


<div class="container">


<h1>📱 RikuDrop</h1>

<div class="subtitle">
iPhone ↔ Windows 画像転送
</div>


<!-- =====================================================
     ルーム
===================================================== -->

<div class="card">

<h2>① ルーム番号</h2>

<p>
2台で同じルーム番号を入力してください。
</p>

<div class="room-area">

<input
    id="roomId"
    type="text"
    value="1234"
    placeholder="例：1234"
>

</div>

</div>


<!-- =====================================================
     接続
===================================================== -->

<div class="card">

<h2>② 接続</h2>

<p class="small">
先にWindows側、その後iPhone側を接続してください。
</p>

<div class="role-buttons">

<button
    id="windowsButton"
    class="windows"
    onclick="startConnection('windows')"
>
💻 Windows側として接続
</button>


<button
    id="iphoneButton"
    class="iphone"
    onclick="startConnection('iphone')"
>
📱 iPhone側として接続
</button>

</div>

</div>


<!-- =====================================================
     状態
===================================================== -->

<div class="card">

<h2>③ 通信状態</h2>

<div
    id="connectionState"
    class="connection-state"
>
未接続
</div>

<div
    id="log"
    class="status"
></div>

</div>


<!-- =====================================================
     ファイル
===================================================== -->

<div class="card">

<h2>④ 画像・ファイル送信</h2>

<div class="file-area">

<input
    id="fileInput"
    type="file"
    accept="image/*"
>

<button
    id="sendButton"
    onclick="sendFile()"
    disabled
>
📤 送信
</button>

</div>


<div class="progress">

<div
    id="progressBar"
    class="progress-bar"
></div>

</div>


<p
    id="progressText"
    class="small"
>
WebRTC接続後に送信できます。
</p>

</div>


<!-- =====================================================
     受信
===================================================== -->

<div class="card">

<h2>⑤ 受信した画像</h2>

<div id="received">

まだ画像を受信していません。

</div>

</div>


</div>


<script>


/* =====================================================
   Cloudflare Worker
===================================================== */

const WORKER_URL =
    "https://ancient-wind-96c6.rikuhira115.workers.dev";


/* =====================================================
   WebRTC設定
===================================================== */

/*
 * 現在はSTUNのみ。
 *
 * TURNはまだ使用していません。
 *
 * 今回のテストで
 *
 * host
 * srflx
 * relay
 *
 * のどれが取得できるか確認します。
 */

const ICE_SERVERS = [

    {
        urls:
            "stun:stun.l.google.com:19302"
    }

];


/* =====================================================
   状態
===================================================== */

let ws = null;

let pc = null;

let dataChannel = null;

let currentRole = null;

let remoteDescriptionSet =
    false;

let pendingCandidates = [];

let incomingFile = null;


/* =====================================================
   HTML
===================================================== */

const roomInput =
    document.getElementById(
        "roomId"
    );

const logArea =
    document.getElementById(
        "log"
    );

const connectionState =
    document.getElementById(
        "connectionState"
    );

const sendButton =
    document.getElementById(
        "sendButton"
    );

const fileInput =
    document.getElementById(
        "fileInput"
    );

const progressBar =
    document.getElementById(
        "progressBar"
    );

const progressText =
    document.getElementById(
        "progressText"
    );

const receivedArea =
    document.getElementById(
        "received"
    );


/* =====================================================
   ログ
===================================================== */

function log(message) {

    const time =
        new Date()
            .toLocaleTimeString();

    logArea.textContent +=
        `[${time}] ${message}\n`;

    logArea.scrollTop =
        logArea.scrollHeight;

}


/* =====================================================
   状態表示
===================================================== */

function setConnectionState(
    text,
    className = ""
) {

    connectionState.textContent =
        text;

    connectionState.className =
        "connection-state " +
        className;

}


/* =====================================================
   Cloudflareへ送信
===================================================== */

function sendSignal(data) {

    if (
        !ws ||
        ws.readyState !==
        WebSocket.OPEN
    ) {

        log(
            "× Cloudflareへ送信できません"
        );

        return false;

    }


    ws.send(
        JSON.stringify(data)
    );

    return true;

}


/* =====================================================
   接続開始
===================================================== */

async function startConnection(
    role
) {

    cleanup();

    currentRole =
        role;

    const roomId =
        roomInput.value.trim();


    if (!roomId) {

        alert(
            "ルーム番号を入力してください。"
        );

        return;

    }


    logArea.textContent = "";


    if (
        role === "windows"
    ) {

        log(
            "Windows側として接続を開始します"
        );

    } else {

        log(
            "iPhone側として接続を開始します"
        );

    }


    setConnectionState(
        "Cloudflareへ接続中...",
        "connecting"
    );


    const roomUrl =
        WORKER_URL +
        "/room/" +
        encodeURIComponent(
            roomId
        );


    log(
        "Cloudflareに接続しています..."
    );


    try {

        ws =
            new WebSocket(
                roomUrl
            );

    } catch (error) {

        log(
            "× WebSocket作成失敗: " +
            error.message
        );

        return;

    }


    /* =================================================
       Cloudflare接続成功
    ================================================= */

    ws.onopen =
        async () => {

            log(
                "✓ Cloudflare WebSocket接続成功"
            );

            log(
                "✓ Cloudflare接続完了"
            );


            createPeerConnection();


            if (
                role === "windows"
            ) {

                log(
                    "WebRTC受信準備をしています..."
                );

                log(
                    "✓ Windows側の準備完了"
                );

                log(
                    "iPhone側の接続を待っています..."
                );

            } else {

                log(
                    "WebRTCを開始します..."
                );


                /*
                 * iPhone側がDataChannelを作成
                 */

                dataChannel =
                    pc.createDataChannel(
                        "rikuDrop"
                    );


                setupDataChannel(
                    dataChannel
                );


                await createOffer();

            }

        };


    /* =================================================
       Cloudflareから受信
    ================================================= */

    ws.onmessage =
        async (event) => {

            try {

                const message =
                    JSON.parse(
                        event.data
                    );


                await handleSignal(
                    message
                );


            } catch (error) {

                log(
                    "× シグナリング処理エラー: " +
                    error.message
                );

            }

        };


    ws.onerror =
        () => {

            log(
                "× Cloudflare WebSocketエラー"
            );

        };


    ws.onclose =
        () => {

            log(
                "Cloudflare WebSocket接続終了"
            );

        };

}


/* =====================================================
   WebRTC PeerConnection
===================================================== */

function createPeerConnection() {


    log(
        "WebRTC PeerConnectionを作成します"
    );


    pc =
        new RTCPeerConnection({

            iceServers:
                ICE_SERVERS

        });


    /* =================================================
       ICE候補
    ================================================= */

    pc.onicecandidate =
        (event) => {

            /*
             * ICE候補が見つかった
             */

            if (
                event.candidate
            ) {

                const candidate =
                    event.candidate;


                /*
                 * candidate文字列から
                 * typeを取得
                 */

                let type =
                    "unknown";


                if (
                    candidate.candidate
                ) {

                    const match =
                        candidate
                            .candidate
                            .match(
                                / typ ([a-zA-Z]+)/
                            );


                    if (match) {

                        type =
                            match[1];

                    }

                }


                log(
                    "📡 ICE候補発見"
                );

                log(
                    "   type: " +
                    type
                );

                log(
                    "   protocol: " +
                    (
                        candidate.protocol ||
                        "unknown"
                    )
                );


                /*
                 * 詳細
                 */

                if (
                    candidate.address
                ) {

                    log(
                        "   address: " +
                        candidate.address
                    );

                }


                /*
                 * 相手へ送信
                 */

                sendSignal({

                    type:
                        "ice-candidate",

                    candidate:
                        candidate.toJSON()

                });

            }


            /*
             * nullの場合
             *
             * ICE候補収集終了
             */

            else {

                log(
                    "✓ ICE候補の収集が終了しました"
                );

            }

        };


    /* =================================================
       ICE候補収集状態
    ================================================= */

    pc.onicegatheringstatechange =
        () => {

            log(
                "ICE候補収集: " +
                pc.iceGatheringState
            );

        };


    /* =================================================
       ICE接続状態
    ================================================= */

    pc.oniceconnectionstatechange =
        () => {

            const state =
                pc.iceConnectionState;


            log(
                "🌐 ICE接続状態: " +
                state
            );


            if (
                state === "connected"
            ) {

                log(
                    "✓ ICE経路が確立しました"
                );

            }


            if (
                state === "completed"
            ) {

                log(
                    "✓ ICE経路の確立が完了しました"
                );

            }


            if (
                state === "checking"
            ) {

                log(
                    "候補ペアを確認しています..."
                );

            }


            if (
                state === "disconnected"
            ) {

                log(
                    "⚠ ICE接続が切断されました"
                );

            }


            if (
                state === "failed"
            ) {

                log(
                    "× ICE経路を確立できませんでした"
                );

                log(
                    "→ TURNが必要か確認します"
                );

            }

        };


    /* =================================================
       WebRTC全体の接続状態
    ================================================= */

    pc.onconnectionstatechange =
        () => {

            const state =
                pc.connectionState;


            log(
                "WebRTC状態: " +
                state
            );


            if (
                state ===
                "connecting"
            ) {

                setConnectionState(
                    "🟡 WebRTC接続中...",
                    "connecting"
                );

            }


            if (
                state ===
                "connected"
            ) {

                setConnectionState(
                    "🟢 WebRTC接続成功",
                    "connected"
                );


                log(
                    "🎉 WebRTC接続成功！"
                );


                if (
                    dataChannel &&
                    dataChannel.readyState ===
                    "open"
                ) {

                    sendButton.disabled =
                        false;

                }

            }


            if (
                state ===
                "failed"
            ) {

                setConnectionState(
                    "🔴 WebRTC接続失敗",
                    "failed"
                );


                log(
                    "× WebRTC接続に失敗しました"
                );

            }

        };


    /* =================================================
       Windows側DataChannel
    ================================================= */

    pc.ondatachannel =
        (event) => {

            log(
                "📩 DataChannelを受信しました"
            );


            dataChannel =
                event.channel;


            setupDataChannel(
                dataChannel
            );

        };


    /* =================================================
       ICE候補エラー
    ================================================= */

    pc.onicecandidateerror =
        (event) => {

            log(
                "⚠ ICE候補エラー"
            );


            log(
                "   code: " +
                event.errorCode
            );


            log(
                "   text: " +
                (
                    event.errorText ||
                    "unknown"
                )
            );

        };


    log(
        "✓ PeerConnection作成完了"
    );

}


/* =====================================================
   Offer
===================================================== */

async function createOffer() {

    try {

        log(
            "Offerを作成しています..."
        );


        const offer =
            await pc.createOffer();


        await pc.setLocalDescription(
            offer
        );


        log(
            "✓ Offerを作成しました"
        );


        sendSignal({

            type:
                "offer",

            offer:
                pc.localDescription

        });


        log(
            "✓ OfferをWindowsへ送信しました"
        );


    } catch (error) {

        log(
            "× Offer作成失敗: " +
            error.message
        );

    }

}


/* =====================================================
   Answer
===================================================== */

async function createAnswer(
    offer
) {

    try {

        log(
            "Offerを設定しています..."
        );


        await pc.setRemoteDescription(
            new RTCSessionDescription(
                offer
            )
        );


        remoteDescriptionSet =
            true;


        log(
            "✓ Offerを設定しました"
        );


        await flushPendingCandidates();


        log(
            "Answerを作成しています..."
        );


        const answer =
            await pc.createAnswer();


        await pc.setLocalDescription(
            answer
        );


        log(
            "✓ Answerを作成しました"
        );


        sendSignal({

            type:
                "answer",

            answer:
                pc.localDescription

        });


        log(
            "✓ AnswerをiPhoneへ送信しました"
        );


    } catch (error) {

        log(
            "× Answer作成失敗: " +
            error.message
        );

    }

}


/* =====================================================
   シグナリング
===================================================== */

async function handleSignal(
    message
) {


    /* -------------------------------------------------
       Offer
    ------------------------------------------------- */

    if (
        message.type ===
        "offer"
    ) {

        log(
            "📩 Offerを受信しました"
        );


        if (
            currentRole !==
            "windows"
        ) {

            return;

        }


        await createAnswer(
            message.offer
        );


        return;

    }


    /* -------------------------------------------------
       Answer
    ------------------------------------------------- */

    if (
        message.type ===
        "answer"
    ) {

        log(
            "📩 Answerを受信しました"
        );


        if (
            currentRole !==
            "iphone"
        ) {

            return;

        }


        try {

            await pc.setRemoteDescription(

                new RTCSessionDescription(
                    message.answer
                )

            );


            remoteDescriptionSet =
                true;


            log(
                "✓ Answerを設定しました"
            );


            await flushPendingCandidates();


        } catch (error) {

            log(
                "× Answer設定失敗: " +
                error.message
            );

        }


        return;

    }


    /* -------------------------------------------------
       ICE Candidate
    ------------------------------------------------- */

    if (
        message.type ===
        "ice-candidate"
    ) {

        if (
            !message.candidate
        ) {

            return;

        }


        log(
            "📩 ICE候補を受信しました"
        );


        /*
         * RemoteDescription前なら
         * 一時保存
         */

        if (
            !remoteDescriptionSet
        ) {

            pendingCandidates.push(
                message.candidate
            );


            log(
                "   → RemoteDescription前なので一時保存"
            );


            return;

        }


        try {

            await pc.addIceCandidate(
                message.candidate
            );


            log(
                "✓ ICE候補を追加しました"
            );


        } catch (error) {

            log(
                "× ICE候補追加失敗: " +
                error.message
            );

        }

    }

}


/* =====================================================
   待機中ICE候補
===================================================== */

async function flushPendingCandidates() {

    if (
        !pc ||
        !remoteDescriptionSet
    ) {

        return;

    }


    if (
        pendingCandidates.length ===
        0
    ) {

        return;

    }


    log(
        "保存していたICE候補を追加します..."
    );


    for (
        const candidate
        of pendingCandidates
    ) {

        try {

            await pc.addIceCandidate(
                candidate
            );


            log(
                "✓ 保存ICE候補を追加しました"
            );


        } catch (error) {

            log(
                "× 保存ICE候補追加失敗: " +
                error.message
            );

        }

    }


    pendingCandidates =
        [];


    log(
        "✓ 保存ICE候補の処理完了"
    );

}


/* =====================================================
   DataChannel
===================================================== */

function setupDataChannel(
    channel
) {

    dataChannel =
        channel;


    dataChannel.binaryType =
        "arraybuffer";


    log(
        "DataChannelを設定しています"
    );


    /* -----------------------------------------------
       開通
    ----------------------------------------------- */

    dataChannel.onopen =
        () => {

            log(
                "🟢 DataChannel接続成功"
            );


            setConnectionState(
                "🟢 接続成功",
                "connected"
            );


            sendButton.disabled =
                false;


            progressText.textContent =
                "接続済み。画像を送信できます。";

        };


    /* -----------------------------------------------
       切断
    ----------------------------------------------- */

    dataChannel.onclose =
        () => {

            log(
                "DataChannel接続終了"
            );


            sendButton.disabled =
                true;

        };


    /* -----------------------------------------------
       エラー
    ----------------------------------------------- */

    dataChannel.onerror =
        () => {

            log(
                "× DataChannelエラー"
            );

        };


    /* -----------------------------------------------
       受信
    ----------------------------------------------- */

    dataChannel.onmessage =
        handleDataMessage;

}


/* =====================================================
   ファイル送信
===================================================== */

async function sendFile() {

    if (
        !dataChannel ||
        dataChannel.readyState !==
        "open"
    ) {

        alert(
            "まだWebRTC接続が完了していません。"
        );

        return;

    }


    const file =
        fileInput.files[0];


    if (!file) {

        alert(
            "送信する画像を選択してください。"
        );

        return;

    }


    log(
        "📤 ファイル送信開始: " +
        file.name
    );


    dataChannel.send(

        JSON.stringify({

            kind:
                "file-start",

            name:
                file.name,

            type:
                file.type ||
                "application/octet-stream",

            size:
                file.size

        })

    );


    const chunkSize =
        16 * 1024;


    let offset =
        0;


    while (
        offset <
        file.size
    ) {


        /*
         * バッファが大きい場合は待つ
         */

        if (
            dataChannel.bufferedAmount >
            1024 * 1024
        ) {

            await waitForBuffer();

        }


        const chunk =
            file.slice(
                offset,
                offset +
                chunkSize
            );


        const buffer =
            await chunk.arrayBuffer();


        dataChannel.send(
            buffer
        );


        offset +=
            buffer.byteLength;


        const percent =
            Math.round(
                offset /
                file.size *
                100
            );


        progressBar.style.width =
            percent + "%";


        progressText.textContent =
            `送信中... ${percent}%`;

    }


    dataChannel.send(

        JSON.stringify({

            kind:
                "file-end"

        })

    );


    progressBar.style.width =
        "100%";


    progressText.textContent =
        "送信完了！";


    log(
        "✓ ファイル送信完了"
    );

}


/* =====================================================
   バッファ待機
===================================================== */

function waitForBuffer() {

    return new Promise(
        resolve => {

            const check =
                () => {

                    if (
                        dataChannel.bufferedAmount <
                        256 * 1024
                    ) {

                        resolve();

                    } else {

                        setTimeout(
                            check,
                            50
                        );

                    }

                };


            check();

        }
    );

}


/* =====================================================
   ファイル受信
===================================================== */

function handleDataMessage(
    event
) {


    /* -----------------------------------------------
       文字列
    ----------------------------------------------- */

    if (
        typeof event.data ===
        "string"
    ) {

        let message;


        try {

            message =
                JSON.parse(
                    event.data
                );

        } catch {

            log(
                "📩 メッセージ: " +
                event.data
            );

            return;

        }


        /* -------------------------------------------
           ファイル開始
        ------------------------------------------- */

        if (
            message.kind ===
            "file-start"
        ) {

            incomingFile = {

                name:
                    message.name,

                type:
                    message.type,

                size:
                    message.size,

                received:
                    0,

                chunks:
                    []

            };


            progressBar.style.width =
                "0%";


            progressText.textContent =
                "受信中... 0%";


            log(
                "📥 ファイル受信開始: " +
                message.name
            );


            return;

        }


        /* -------------------------------------------
           ファイル終了
        ------------------------------------------- */

        if (
            message.kind ===
            "file-end"
        ) {

            finishFileReceive();

            return;

        }


        return;

    }


    /* -----------------------------------------------
       バイナリ
    ----------------------------------------------- */

    if (
        incomingFile
    ) {

        incomingFile.chunks.push(
            event.data
        );


        incomingFile.received +=
            event.data.byteLength;


        const percent =
            Math.round(
                incomingFile.received /
                incomingFile.size *
                100
            );


        progressBar.style.width =
            percent + "%";


        progressText.textContent =
            `受信中... ${percent}%`;

    }

}


/* =====================================================
   ファイル受信完了
===================================================== */

function finishFileReceive() {

    if (
        !incomingFile
    ) {

        return;

    }


    const blob =
        new Blob(
            incomingFile.chunks,
            {
                type:
                    incomingFile.type
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    receivedArea.innerHTML =
        "";


    const title =
        document.createElement(
            "p"
        );


    title.textContent =
        "📥 " +
        incomingFile.name;


    title.style.fontWeight =
        "bold";


    receivedArea.appendChild(
        title
    );


    /* -----------------------------------------------
       画像表示
    ----------------------------------------------- */

    if (
        incomingFile.type.startsWith(
            "image/"
        )
    ) {

        const image =
            document.createElement(
                "img"
            );


        image.src =
            url;


        image.alt =
            incomingFile.name;


        receivedArea.appendChild(
            image
        );

    }


    /* -----------------------------------------------
       保存リンク
    ----------------------------------------------- */

    const link =
        document.createElement(
            "a"
        );


    link.href =
        url;


    link.download =
        incomingFile.name;


    link.textContent =
        "⬇️ このファイルを保存";


    link.style.display =
        "inline-block";


    link.style.marginTop =
        "12px";


    receivedArea.appendChild(
        link
    );


    progressBar.style.width =
        "100%";


    progressText.textContent =
        "受信完了！";


    log(
        "✓ ファイル受信完了: " +
        incomingFile.name
    );


    incomingFile =
        null;

}


/* =====================================================
   接続終了
===================================================== */

function cleanup() {

    remoteDescriptionSet =
        false;


    pendingCandidates =
        [];


    incomingFile =
        null;


    if (dataChannel) {

        try {

            dataChannel.close();

        } catch {}

        dataChannel =
            null;

    }


    if (pc) {

        try {

            pc.close();

        } catch {}

        pc =
            null;

    }


    if (ws) {

        try {

            ws.close();

        } catch {}

        ws =
            null;

    }


    sendButton.disabled =
        true;


    progressBar.style.width =
        "0%";


    progressText.textContent =
        "WebRTC接続後に送信できます。";

}
