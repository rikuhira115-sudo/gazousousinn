<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RikuDrop 通信テスト</title>
<style>
  body { font-family: sans-serif; padding: 20px; background: #f7f7f7; }
  h2 { text-align: center; }
  #log {
    background: white; padding: 15px; border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    margin-top: 20px; font-size: 20px;
  }
  button {
    width: 100%; padding: 12px; margin-top: 10px;
    background: #4CAF50; color: white; border: none;
    border-radius: 10px; font-size: 18px;
  }
</style>
</head>

<body>

<h2>RikuDrop 通信テスト</h2>

<div id="log">まだ通信していません</div>

<button onclick="sendTestMessage()">テストメッセージ送信</button>

<script>
  const WORKER_URL = "https://ancient-wind-96c6.rikuhira115.workers.dev";

  let pc = new RTCPeerConnection();
  let channel = pc.createDataChannel("test");

  const log = (msg) => {
    document.getElementById("log").innerText = msg;
  };

  // 受信したら画面に表示
  channel.onmessage = (e) => {
    log("受信: " + e.data);
  };

  // テストメッセージ送信
  function sendTestMessage() {
    const msg = window.innerWidth < 600
      ? "HELLO_FROM_PHONE"
      : "HELLO_FROM_PC";

    channel.send(msg);
    log("送信: " + msg);
  }

  // スマホ側：offer を送る
  async function sendOffer() {
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    await fetch(WORKER_URL, {
      method: "POST",
      body: JSON.stringify({ offer })
    });

    log("スマホ側: offer を送信");
  }

  // PC側：offer を取得して answer を返す
  async function answerOffer() {
    const res = await fetch(WORKER_URL, {
      method: "POST",
      body: JSON.stringify({ answer: "request-offer" })
    });

    const data = await res.json();
    if (!data.offer) {
      log("PC側: offer がまだ来ていません");
      return;
    }

    log("PC側: offer を受信");

    await pc.setRemoteDescription(data.offer);

    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);

    const res2 = await fetch(WORKER_URL, {
      method: "POST",
      body: JSON.stringify({ answer })
    });

    const finalData = await res2.json();
    await pc.setRemoteDescription(finalData.answer);

    log("PC側: answer を返して接続完了");
  }

  // 自動判定
  if (window.innerWidth < 600) {
    sendOffer();  // スマホ
  } else {
    answerOffer(); // PC
  }
</script>

</body>
</html>
