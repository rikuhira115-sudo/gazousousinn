<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RikuDrop</title>
<style>
  body {
    font-family: sans-serif;
    margin: 0;
    padding: 20px;
    background: #f7f7f7;
  }

  h2 {
    text-align: center;
    margin-bottom: 20px;
  }

  #sendArea {
    background: white;
    padding: 15px;
    border-radius: 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    margin-bottom: 20px;
  }

  #fileInput {
    width: 100%;
    margin-bottom: 10px;
  }

  button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: #4CAF50;
    color: white;
    font-size: 16px;
  }

  #receivedArea {
    background: white;
    padding: 15px;
    border-radius: 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  }

  .fileItem {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #fafafa;
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 8px;
  }

  .deleteBtn {
    background: #e74c3c;
    color: white;
    border: none;
    padding: 6px 10px;
    border-radius: 6px;
  }
</style>
</head>

<body>

<h2>RikuDrop（Snapdrop自作版）</h2>

<div id="sendArea">
  <h3>送信するファイルを選択</h3>
  <input type="file" id="fileInput" multiple>
  <button onclick="sendFiles()">送信する</button>
</div>

<div id="receivedArea">
  <h3>受信したファイル</h3>
  <div id="receivedList"></div>
</div>

<script>
  // WebRTC 接続準備
  let pc = new RTCPeerConnection();
  let channel = pc.createDataChannel("file");

  // 受信処理
  channel.onmessage = (e) => {
    const blob = new Blob([e.data]);
    const url = URL.createObjectURL(blob);

    const fileName = "received_" + Date.now();

    const div = document.createElement("div");
    div.className = "fileItem";

    const link = document.createElement("a");
    link.href = url;
    link.download = fileName;
    link.textContent = fileName;

    const del = document.createElement("button");
    del.className = "deleteBtn";
    del.textContent = "削除";
    del.onclick = () => div.remove();

    div.appendChild(link);
    div.appendChild(del);

    document.getElementById("receivedList").appendChild(div);
  };

  // 送信処理（複数ファイル対応）
  async function sendFiles() {
    const files = document.getElementById("fileInput").files;
    if (!files.length) return;

    for (const file of files) {
      channel.send(await file.arrayBuffer());
    }

    alert("送信完了！");
  }

  // シグナリング（Workers と通信）
  async function signaling() {
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    const res = await fetch("https://ancient-wind-96c6.rikuhira115.workers.dev", {
      method: "POST",
      body: JSON.stringify({ offer })
    });

    const { answer } = await res.json();
    await pc.setRemoteDescription(answer);
  }

  signaling();
</script>

</body>
</html>
