<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>RikuDrop</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background:
    linear-gradient(
      135deg,
      #eef5ff,
      #f8fbff
    );

  color: #222;
}

.container {
  width: min(
    900px,
    calc(100% - 30px)
  );

  margin: 0 auto;

  padding: 40px 0 60px;
}

h1 {
  text-align: center;

  margin: 0;

  font-size: 42px;
}

.subtitle {
  text-align: center;

  color: #666;

  margin-top: 8px;
  margin-bottom: 35px;
}


/* =====================================
   カード
===================================== */

.card {
  background: white;

  border-radius: 20px;

  padding: 25px;

  margin-bottom: 20px;

  box-shadow:
    0 10px 30px
    rgba(0, 0, 0, 0.08);
}


/* =====================================
   ルーム入力
===================================== */

.room-title {
  font-size: 22px;

  font-weight: bold;

  margin-bottom: 10px;
}

.room-description {
  color: #666;

  margin-bottom: 18px;
}

.room-input-area {
  display: flex;

  gap: 10px;

  flex-wrap: wrap;
}

#roomInput {
  flex: 1;

  min-width: 180px;

  height: 55px;

  border:
    2px solid #ddd;

  border-radius: 12px;

  padding: 0 18px;

  font-size: 24px;

  text-align: center;

  letter-spacing: 5px;

  outline: none;
}

#roomInput:focus {
  border-color: #4285f4;
}

button {
  border: none;

  border-radius: 12px;

  padding:
    13px 20px;

  font-size: 16px;

  font-weight: bold;

  cursor: pointer;

  transition:
    transform 0.1s,
    opacity 0.1s;
}

button:active {
  transform: scale(0.97);
}

.primary-button {
  background: #4285f4;

  color: white;
}

.secondary-button {
  background: #edf2f7;

  color: #333;
}

.danger-button {
  background: #ffe7e7;

  color: #c62828;
}

button:disabled {
  opacity: 0.5;

  cursor: not-allowed;
}


/* =====================================
   接続状態
===================================== */

.status {
  text-align: center;

  font-weight: bold;

  padding: 13px;

  border-radius: 10px;

  background: #f1f5f9;

  margin-bottom: 20px;
}

.status.connected {
  background: #e7f8ed;

  color: #16833b;
}

.status.waiting {
  background: #fff7df;

  color: #8a6500;
}

.status.error {
  background: #ffe8e8;

  color: #c62828;
}


/* =====================================
   ファイル選択
===================================== */

.file-buttons {
  display: flex;

  gap: 10px;

  flex-wrap: wrap;

  margin-bottom: 20px;
}

.file-list {
  display: flex;

  flex-direction: column;

  gap: 10px;

  margin-bottom: 20px;
}

.file-item {
  display: flex;

  align-items: center;

  gap: 12px;

  padding: 12px 15px;

  background: #f7f9fc;

  border-radius: 12px;
}

.file-icon {
  font-size: 25px;

  width: 35px;

  text-align: center;
}

.file-info {
  flex: 1;

  min-width: 0;
}

.file-name {
  font-weight: bold;

  word-break: break-all;
}

.file-size {
  color: #777;

  font-size: 13px;

  margin-top: 3px;
}

.remove-file {
  background: #eee;

  color: #555;

  padding:
    7px 11px;

  border-radius: 8px;
}


/* =====================================
   送信
===================================== */

.send-area {
  margin-top: 15px;
}

#sendButton {
  width: 100%;

  font-size: 18px;

  padding: 16px;
}


/* =====================================
   プログレス
===================================== */

.progress-container {
  display: none;

  margin-top: 20px;
}

.progress-container.show {
  display: block;
}

.progress-label {
  margin-bottom: 7px;

  font-size: 14px;

  color: #555;
}

.progress-bar-background {
  width: 100%;

  height: 12px;

  background: #e5e7eb;

  border-radius: 20px;

  overflow: hidden;
}

.progress-bar {
  width: 0%;

  height: 100%;

  background: #4285f4;

  transition:
    width 0.1s linear;
}


/* =====================================
   受信ファイル
===================================== */

.received-list {
  display: flex;

  flex-direction: column;

  gap: 12px;
}

.received-item {
  background: #f7f9fc;

  border-radius: 14px;

  padding: 15px;
}

.received-top {
  display: flex;

  align-items: center;

  gap: 12px;
}

.received-name {
  flex: 1;

  min-width: 0;

  font-weight: bold;

  word-break: break-all;
}

.download-button {
  background: #4285f4;

  color: white;

  padding:
    9px 13px;

  border-radius: 9px;

  text-decoration: none;

  font-size: 14px;

  font-weight: bold;

  display: inline-block;
}

.preview {
  max-width: 100%;

  max-height: 300px;

  display: block;

  margin-top: 12px;

  border-radius: 10px;
}


/* =====================================
   接続情報
===================================== */

.room-display {
  text-align: center;

  font-size: 28px;

  font-weight: bold;

  letter-spacing: 5px;

  margin:
    10px 0 15px;
}

.disconnect-area {
  text-align: center;

  margin-top: 20px;
}


/* =====================================
   非表示
===================================== */

.hidden {
  display: none !important;
}


/* =====================================
   モバイル
===================================== */

@media (max-width: 600px) {

  .container {
    width:
      calc(100% - 20px);

    padding-top: 25px;
  }

  h1 {
    font-size: 34px;
  }

  .card {
    padding: 18px;

    border-radius: 16px;
  }

  .room-input-area {
    flex-direction: column;
  }

  #roomInput {
    width: 100%;
  }

  .room-input-area button {
    width: 100%;
  }

  .file-buttons button {
    flex: 1;
  }

}

</style>
</head>


<body>

<div class="container">

  <h1>RikuDrop</h1>

  <div class="subtitle">
    端末間でファイルをかんたん送受信
  </div>


  <!-- ==================================
       ルーム接続
  =================================== -->

  <div
    id="roomCard"
    class="card"
  >

    <div class="room-title">
      ルームに接続
    </div>

    <div class="room-description">
      2台の端末で同じルーム番号を入力してください。
      <br>
      ルーム番号は1～3桁です。
    </div>

    <div class="room-input-area">

      <input
        id="roomInput"
        type="text"
        inputmode="numeric"
        maxlength="3"
        pattern="[0-9]{1,3}"
        placeholder="123"
        autocomplete="off"
      >

      <button
        id="randomRoomButton"
        class="secondary-button"
        type="button"
      >
        ランダム
      </button>

      <button
        id="connectButton"
        class="primary-button"
        type="button"
      >
        接続する
      </button>

    </div>

  </div>


  <!-- ==================================
       接続中
  =================================== -->

  <div
    id="connectionCard"
    class="card hidden"
  >

    <div
      id="status"
      class="status waiting"
    >
      接続準備中...
    </div>

    <div
      class="room-display"
      id="roomDisplay"
    >
      ---
    </div>

    <div
      style="
        text-align:center;
        color:#666;
      "
    >
      相手の端末にも
      <strong>同じルーム番号</strong>
      を入力してください。
    </div>

  </div>


  <!-- ==================================
       ファイル送信
  =================================== -->

  <div
    id="fileCard"
    class="card hidden"
  >

    <div class="room-title">
      📤 ファイルを送信
    </div>

    <div
      class="file-buttons"
    >

      <button
        id="selectFilesButton"
        class="primary-button"
        type="button"
      >
        ファイルを追加
      </button>

      <button
        id="clearFilesButton"
        class="danger-button"
        type="button"
      >
        すべて解除
      </button>

    </div>


    <input
      id="fileInput"
      type="file"
      multiple
      style="display:none"
    >


    <div
      id="fileList"
      class="file-list"
    >
    </div>


    <div class="send-area">

      <button
        id="sendButton"
        class="primary-button"
        type="button"
        disabled
      >
        ファイルを送信
      </button>

    </div>


    <div
      id="progressContainer"
      class="progress-container"
    >

      <div
        id="progressLabel"
        class="progress-label"
      >
        送信中...
      </div>

      <div
        class="progress-bar-background"
      >

        <div
          id="progressBar"
          class="progress-bar"
        >
        </div>

      </div>

    </div>

  </div>


  <!-- ==================================
       受信ファイル
  =================================== -->

  <div
    id="receivedCard"
    class="card hidden"
  >

    <div class="room-title">
      📥 受信したファイル
    </div>

    <div
      id="receivedList"
      class="received-list"
    >
    </div>

  </div>


  <!-- ==================================
       切断
  =================================== -->

  <div
    id="disconnectArea"
    class="disconnect-area hidden"
  >

    <button
      id="disconnectButton"
      class="secondary-button"
      type="button"
    >
      接続を終了
    </button>

  </div>

</div>


<script>

/* =========================================
   設定
========================================= */

const WORKER_URL =
  "https://ancient-wind-96c6.rikuhira115.workers.dev";


/*
 * STUN
 */
const ICE_SERVERS = [
  {
    urls:
      "stun:stun.cloudflare.com:3478"
  }
];


/*
 * ファイル分割サイズ
 *
 * 16KB
 */
const CHUNK_SIZE =
  16 * 1024;


/* =========================================
   DOM
========================================= */

const roomCard =
  document.getElementById(
    "roomCard"
  );

const connectionCard =
  document.getElementById(
    "connectionCard"
  );

const fileCard =
  document.getElementById(
    "fileCard"
  );

const receivedCard =
  document.getElementById(
    "receivedCard"
  );

const disconnectArea =
  document.getElementById(
    "disconnectArea"
  );


const roomInput =
  document.getElementById(
    "roomInput"
  );

const randomRoomButton =
  document.getElementById(
    "randomRoomButton"
  );

const connectButton =
  document.getElementById(
    "connectButton"
  );


const status =
  document.getElementById(
    "status"
  );

const roomDisplay =
  document.getElementById(
    "roomDisplay"
  );


const fileInput =
  document.getElementById(
    "fileInput"
  );

const selectFilesButton =
  document.getElementById(
    "selectFilesButton"
  );

const clearFilesButton =
  document.getElementById(
    "clearFilesButton"
  );

const fileList =
  document.getElementById(
    "fileList"
  );

const sendButton =
  document.getElementById(
    "sendButton"
  );


const progressContainer =
  document.getElementById(
    "progressContainer"
  );

const progressLabel =
  document.getElementById(
    "progressLabel"
  );

const progressBar =
  document.getElementById(
    "progressBar"
  );


const receivedList =
  document.getElementById(
    "receivedList"
  );


const disconnectButton =
  document.getElementById(
    "disconnectButton"
  );


/* =========================================
   状態
========================================= */

let socket = null;

let peerConnection = null;

let dataChannel = null;

let peerRole = null;

let currentRoomId = null;


/*
 * 選択されたファイル
 */
let selectedFiles = [];


/*
 * ICE候補を一時保存
 */
let pendingCandidates = [];


/*
 * 受信中ファイル
 */
const receivingFiles = new Map();


/* =========================================
   ルーム番号入力
========================================= */

roomInput.addEventListener(
  "input",
  () => {

    /*
     * 数字以外を削除
     */
    roomInput.value =
      roomInput.value
        .replace(/\D/g, "")
        .slice(0, 3);
  }
);


/* =========================================
   ランダムルーム
========================================= */

randomRoomButton.addEventListener(
  "click",
  () => {

    const number =
      Math.floor(
        Math.random() * 900
      ) + 100;

    roomInput.value =
      String(number);
  }
);


/* =========================================
   接続開始
========================================= */

connectButton.addEventListener(
  "click",
  () => {

    connectToRoom();
  }
);


/*
 * Enterキーでも接続
 */
roomInput.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter"
    ) {

      connectToRoom();
    }
  }
);


/* =========================================
   ルーム接続
========================================= */

function connectToRoom() {

  let roomId =
    roomInput.value.trim();


  /*
   * 入力チェック
   */
  if (
    !/^\d{1,3}$/.test(roomId)
  ) {

    alert(
      "ルーム番号は1～3桁の数字で入力してください。"
    );

    return;
  }


  currentRoomId =
    roomId;


  /*
   * UI変更
   */
  roomCard.classList.add(
    "hidden"
  );

  connectionCard.classList.remove(
    "hidden"
  );

  fileCard.classList.add(
    "hidden"
  );

  receivedCard.classList.add(
    "hidden"
  );

  disconnectArea.classList.remove(
    "hidden"
  );


  roomDisplay.textContent =
    currentRoomId;


  setStatus(
    "ルームに接続中...",
    "waiting"
  );


  /*
   * WebSocket URL
   */
  const wsUrl =
    WORKER_URL
      .replace(/^http/, "ws")
      + `/room/${encodeURIComponent(
        currentRoomId
      )}`;


  console.log(
    "ルーム接続:",
    currentRoomId
  );


  console.log(
    "WebSocket:",
    wsUrl
  );


  socket =
    new WebSocket(wsUrl);


  /*
   * 接続成功
   */
  socket.onopen =
    () => {

      console.log(
        "✓ Cloudflare WebSocket接続成功"
      );

      setStatus(
        "相手の端末を待っています...",
        "waiting"
      );
    };


  /*
   * シグナリング受信
   */
  socket.onmessage =
    async event => {

      try {

        const message =
          JSON.parse(
            event.data
          );


        console.log(
          "シグナリング:",
          message
        );


        await handleSignalingMessage(
          message
        );

      } catch (error) {

        console.error(
          "シグナリング処理エラー:",
          error
        );

      }
    };


  /*
   * WebSocketエラー
   */
  socket.onerror =
    error => {

      console.error(
        "WebSocketエラー:",
        error
      );

      setStatus(
        "接続エラーが発生しました",
        "error"
      );
    };


  /*
   * WebSocket切断
   */
  socket.onclose =
    () => {

      console.log(
        "WebSocket切断"
      );
    };
}


/* =========================================
   シグナリング処理
========================================= */

async function handleSignalingMessage(
  message
) {

  /*
   * 待機
   */
  if (
    message.type ===
    "waiting"
  ) {

    setStatus(
      "相手の端末を待っています...",
      "waiting"
    );

    return;
  }


  /*
   * ペア成立
   */
  if (
    message.type ===
    "paired"
  ) {

    peerRole =
      message.role;


    console.log(
      "ペア成立:",
      peerRole
    );


    setStatus(
      "相手が見つかりました。接続中...",
      "waiting"
    );


    await createPeerConnection();


    /*
     * Offer側
     */
    if (
      peerRole ===
      "offerer"
    ) {

      await createOffer();
    }


    return;
  }


  /*
   * Offer
   */
  if (
    message.type ===
    "offer"
  ) {

    await handleOffer(
      message.offer
    );

    return;
  }


  /*
   * Answer
   */
  if (
    message.type ===
    "answer"
  ) {

    await handleAnswer(
      message.answer
    );

    return;
  }


  /*
   * ICE Candidate
   */
  if (
    message.type ===
    "candidate"
  ) {

    await handleCandidate(
      message.candidate
    );

    return;
  }


  /*
   * 相手が退出
   */
  if (
    message.type ===
    "peer-left"
  ) {

    setStatus(
      "相手が接続を終了しました",
      "error"
    );


    fileCard.classList.add(
      "hidden"
    );

    return;
  }
}


/* =========================================
   PeerConnection作成
========================================= */

async function createPeerConnection() {

  /*
   * すでに存在する場合
   */
  if (
    peerConnection
  ) {

    return;
  }


  console.log(
    "PeerConnection作成"
  );


  peerConnection =
    new RTCPeerConnection({
      iceServers:
        ICE_SERVERS
    });


  /*
   * ICE Candidate
   */
  peerConnection.onicecandidate =
    event => {

      if (
        event.candidate
      ) {

        console.log(
          "ICE候補:",
          event.candidate
        );


        sendSignal({
          type:
            "candidate",

          candidate:
            event.candidate
        });
      }
    };


  /*
   * ICE状態
   */
  peerConnection.oniceconnectionstatechange =
    () => {

      console.log(
        "🌐 ICE接続状態:",
        peerConnection
          .iceConnectionState
      );


      if (
        peerConnection
          .iceConnectionState ===
        "connected" ||
        peerConnection
          .iceConnectionState ===
        "completed"
      ) {

        setStatus(
          "接続しました",
          "connected"
        );

        showConnectedUI();
      }


      if (
        peerConnection
          .iceConnectionState ===
        "failed"
      ) {

        setStatus(
          "WebRTC接続に失敗しました",
          "error"
        );

        console.error(
          "WebRTC接続失敗"
        );
      }
    };


  /*
   * WebRTC接続状態
   */
  peerConnection.onconnectionstatechange =
    () => {

      console.log(
        "WebRTC状態:",
        peerConnection
          .connectionState
      );
    };


  /*
   * Answer側がDataChannelを受け取る
   */
  peerConnection.ondatachannel =
    event => {

      console.log(
        "DataChannel受信"
      );

      setupDataChannel(
        event.channel
      );
    };


  /*
   * Offer側
   *
   * DataChannelを作る
   */
  if (
    peerRole ===
    "offerer"
  ) {

    const channel =
      peerConnection.createDataChannel(
        "fileTransfer"
      );

    setupDataChannel(
      channel
    );
  }
}


/* =========================================
   DataChannel設定
========================================= */

function setupDataChannel(
  channel
) {

  dataChannel =
    channel;


  /*
   * バッファ制御
   */
  dataChannel.bufferedAmountLowThreshold =
    CHUNK_SIZE * 8;


  /*
   * 接続
   */
  dataChannel.onopen =
    () => {

      console.log(
        "✓ DataChannel接続成功"
      );

      setStatus(
        "接続済み",
        "connected"
      );

      showConnectedUI();
    };


  /*
   * 切断
   */
  dataChannel.onclose =
    () => {

      console.log(
        "DataChannel切断"
      );
    };


  /*
   * エラー
   */
  dataChannel.onerror =
    error => {

      console.error(
        "DataChannelエラー:",
        error
      );
    };


  /*
   * データ受信
   */
  dataChannel.onmessage =
    async event => {

      await handleDataMessage(
        event.data
      );
    };
}


/* =========================================
   Offer作成
========================================= */

async function createOffer() {

  console.log(
    "Offer作成"
  );


  const offer =
    await peerConnection.createOffer();


  await peerConnection.setLocalDescription(
    offer
  );


  sendSignal({
    type:
      "offer",

    offer:
      peerConnection.localDescription
  });


  console.log(
    "→ Offer送信"
  );
}


/* =========================================
   Offer受信
========================================= */

async function handleOffer(
  offer
) {

  console.log(
    "← Offer受信"
  );


  await peerConnection.setRemoteDescription(
    new RTCSessionDescription(
      offer
    )
  );


  /*
   * 待機していたICE候補を処理
   */
  await flushPendingCandidates();


  const answer =
    await peerConnection.createAnswer();


  await peerConnection.setLocalDescription(
    answer
  );


  sendSignal({
    type:
      "answer",

    answer:
      peerConnection.localDescription
  });


  console.log(
    "→ Answer送信"
  );
}


/* =========================================
   Answer受信
========================================= */

async function handleAnswer(
  answer
) {

  console.log(
    "← Answer受信"
  );


  await peerConnection.setRemoteDescription(
    new RTCSessionDescription(
      answer
    )
  );


  await flushPendingCandidates();
}


/* =========================================
   ICE Candidate
========================================= */

async function handleCandidate(
  candidate
) {

  /*
   * RemoteDescriptionがまだない場合
   */
  if (
    !peerConnection ||
    !peerConnection.remoteDescription
  ) {

    pendingCandidates.push(
      candidate
    );

    return;
  }


  try {

    await peerConnection.addIceCandidate(
      new RTCIceCandidate(
        candidate
      )
    );

  } catch (error) {

    console.error(
      "ICE候補追加エラー:",
      error
    );
  }
}


/* =========================================
   ICE候補キュー処理
========================================= */

async function flushPendingCandidates() {

  while (
    pendingCandidates.length > 0
  ) {

    const candidate =
      pendingCandidates.shift();


    try {

      await peerConnection.addIceCandidate(
        new RTCIceCandidate(
          candidate
        )
      );

    } catch (error) {

      console.error(
        "ICE候補追加エラー:",
        error
      );
    }
  }
}


/* =========================================
   シグナリング送信
========================================= */

function sendSignal(
  message
) {

  if (
    !socket ||
    socket.readyState !==
    WebSocket.OPEN
  ) {

    console.error(
      "WebSocketが接続されていません"
    );

    return;
  }


  socket.send(
    JSON.stringify(message)
  );
}


/* =========================================
   接続済みUI
========================================= */

/* =========================================

========================================= */

  type

/* =========================================
   ファイル選択
========================================= */

selectFilesButton.addEventListener(
  "click",
  () => {

    fileInput.click();
  }
);


fileInput.addEventListener(
  "change",
  () => {

      Array.from(
        fileInput.files
      );


    /*
     * 追加
     */
    selectedFiles.push(
      ...files
    );


    /*
     * 同じファイルを

     */

    /*
     * inputをリセット
     *

     * 再度選択できるようにする
     */

  }

/* =========================================
   ファイル一覧表示
========================================= */

function renderFileList() {

  fileList.innerHTML = "";


  if (
    selectedFiles.length === 0
  ) {

    sendButton.disabled =
      true;

    return;
  }


  selectedFiles.forEach(
    (file, index) => {

      const item =
        document.createElement(
          "div"
        );

      item.className =
        "file-item";


      const icon =
        document.createElement(
          "div"
        );

      icon.className =
        "file-icon";

      icon.textContent =
        getFileIcon(file);


      const info =
        document.createElement(
          "div"
        );

      info.className =
        "file-info";


      const name =
        document.createElement(
          "div"
        );

      name.className =
        "file-name";

      name.textContent =
        file.name;


      const size =
        document.createElement(
          "div"
        );

      size.className =
        "file-size";

      size.textContent =
        formatFileSize(
          file.size
        );


      info.appendChild(
        name
      );

      info.appendChild(
        size
      );


      const remove =
        document.createElement(
          "button"
        );

      remove.className =
        "remove-file";

      remove.type =
        "button";

      remove.textContent =
        "×";


      remove.addEventListener(
        "click",
        () => {

          selectedFiles.splice(
            index,
            1
          );

          renderFileList();
        }
      );


      item.appendChild(
        icon
      );

      item.appendChild(
        info
      );

      item.appendChild(
        remove
      );


      fileList.appendChild(
        item
      );
    }
  );


  sendButton.disabled =
    false;
}


/* =========================================
   全ファイル解除
========================================= */

clearFilesButton.addEventListener(
  "click",
  () => {

    selectedFiles = [];

    renderFileList();
  }
);


/* =========================================
   ファイルアイコン
========================================= */

function getFileIcon(
  file
) {

  const type =
    file.type || "";


  if (
    type.startsWith(
      "image/"
    )
  ) {

    return "🖼️";
  }


  if (
    type.startsWith(
      "video/"
    )
  ) {

    return "🎥";
  }


  if (
    type.startsWith(
      "audio/"
    )
  ) {

    return "🎵";
  }


  if (
    type.includes(
      "pdf"
    )
  ) {

    return "📕";
  }


  if (
    type.includes(
      "word"
    ) ||
    file.name.endsWith(
      ".doc"
    ) ||
    file.name.endsWith(
      ".docx"
    )
  ) {

    return "📘";
  }


  if (
    type.includes(
      "sheet"
    ) ||
    file.name.endsWith(
      ".xls"
    ) ||
    file.name.endsWith(
      ".xlsx"
    )
  ) {

    return "📗";
  }


  if (
    file.name.endsWith(
      ".zip"
    ) ||
    file.name.endsWith(
      ".rar"
    ) ||
    file.name.endsWith(
      ".7z"
    )
  ) {

    return "🗜️";
  }


  return "📄";
}


/* =========================================
   ファイルサイズ表示
========================================= */

function formatFileSize(
  bytes
) {

  if (
    bytes < 1024
  ) {

    return `${bytes} B`;
  }


  if (
    bytes < 1024 * 1024
  ) {

    return `${(
      bytes / 1024
    ).toFixed(1)} KB`;
  }


  if (
    bytes <
    1024 * 1024 * 1024
  ) {

    return `${(
      bytes /
      1024 /
      1024
    ).toFixed(1)} MB`;
  }


  return `${(
    bytes /
    1024 /
    1024 /
    1024
  ).toFixed(2)} GB`;
}


/* =========================================
   ファイル送信
========================================= */

sendButton.addEventListener(
  "click",
  async () => {

    if (
      selectedFiles.length === 0
    ) {

      return;
    }


    if (
      !dataChannel ||
      dataChannel.readyState !==
      "open"
    ) {

      alert(
        "まだ端末同士が接続されていません。"
      );

      return;
    }


    sendButton.disabled =
      true;

    selectFilesButton.disabled =
      true;

    clearFilesButton.disabled =
      true;


    try {

      for (
        let i = 0;
        i < selectedFiles.length;
        i++
      ) {

        const file =
          selectedFiles[i];


        await sendFile(
          file,
          i + 1,
          selectedFiles.length
        );
      }


      progressLabel.textContent =
        "送信完了";

      progressBar.style.width =
        "100%";


    } catch (error) {

      console.error(
        "ファイル送信エラー:",
        error
      );

      alert(
        "ファイルの送信中にエラーが発生しました。"
      );

    } finally {

      sendButton.disabled =
        false;

      selectFilesButton.disabled =
        false;

      clearFilesButton.disabled =
        false;
    }
  }
);


/* =========================================
   1ファイル送信
========================================= */

async function sendFile(
  file,
  fileNumber,
  totalFiles
) {

  const fileId =
    `${Date.now()}-${Math.random()
      .toString(36)
      .slice(2)}`;


  /*
   * ファイル開始通知
   */
  dataChannel.send(
    JSON.stringify({
      type:
        "file-start",

      id:
        fileId,

      name:
        file.name,

      size:
        file.size,

      mime:
        file.type ||
        "application/octet-stream"
    })
  );


  let offset = 0;


  while (
    offset < file.size
  ) {

    /*
     * DataChannelの
     * バッファが大きくなりすぎないようにする
     */
    await waitForBuffer();


    const chunk =
      await file
        .slice(
          offset,
          offset +
            CHUNK_SIZE
        )
        .arrayBuffer();


    dataChannel.send(
      chunk
    );


    offset +=
      chunk.byteLength;


    const percent =
      file.size === 0
        ? 100
        :
        Math.round(
          offset /
          file.size *
          100
        );


    progressContainer.classList.add(
      "show"
    );


    progressLabel.textContent =
      `送信中 ${fileNumber}/${totalFiles}: ${file.name} (${percent}%)`;


    progressBar.style.width =
      `${percent}%`;


    /*
     * UIを更新する時間を作る
     */
    await new Promise(
      resolve =>
        setTimeout(
          resolve,
          0
        )
    );
  }


  /*
   * ファイル終了通知
   */
  dataChannel.send(
    JSON.stringify({
      type:
        "file-end",

      id:
        fileId
    })
  );
}


/* =========================================
   DataChannelバッファ待機
========================================= */

async function waitForBuffer() {

  /*
   * 16MBを超えたら待つ
   */
  while (
    dataChannel.bufferedAmount >
    16 * 1024 * 1024
  ) {

    await new Promise(
      resolve => {

        const check =
          () => {

            if (
              dataChannel.bufferedAmount <=
              8 * 1024 * 1024
            ) {

              resolve();

            } else {

              setTimeout(
                check,
                20
              );
            }
          };


        check();
      }
    );
  }
}


/* =========================================
   受信処理
========================================= */

async function handleDataMessage(
  data
) {

  /*
   * JSONメッセージ
   */
  if (
    typeof data ===
    "string"
  ) {

    const message =
      JSON.parse(
        data
      );


    /*
     * ファイル開始
     */
    if (
      message.type ===
      "file-start"
    ) {

      receivingFiles.set(
        message.id,
        {
          id:
            message.id,

          name:
            message.name,

          size:
            message.size,

          mime:
            message.mime,

          chunks: [],

          received:
            0
        }
      );


      console.log(
        "受信開始:",
        message.name
      );


      showReceivingProgress(
        message.id,
        message.name,
        0
      );


      return;
    }


    /*
     * ファイル終了
     */
    if (
      message.type ===
      "file-end"
    ) {

      await finishReceivingFile(
        message.id
      );


      return;
    }
  }


  /*
   * バイナリデータ
   */
  let buffer;


  if (
    data instanceof ArrayBuffer
  ) {

    buffer =
      data;

  } else if (
    data instanceof Blob
  ) {

    buffer =
      await data.arrayBuffer();

  } else {

    return;
  }


  /*
   * 現在受信中のファイルを取得
   *
   * 同時に複数ファイルを
   * 送らないため先頭のものを使用
   */
  const iterator =
    receivingFiles.values();


  const receivingFile =
    iterator.next().value;


  if (
    !receivingFile
  ) {

    return;
  }


  receivingFile.chunks.push(
    buffer
  );


  receivingFile.received +=
    buffer.byteLength;


  const percent =
    receivingFile.size === 0
      ? 100
      :
      Math.round(
        receivingFile.received /
        receivingFile.size *
        100
      );


  showReceivingProgress(
    receivingFile.id,
    receivingFile.name,
    percent
  );
}


/* =========================================
   受信ファイル完成
========================================= */

async function finishReceivingFile(
  id
) {

  const info =
    receivingFiles.get(
      id
    );


  if (!info) {

    return;
  }


  const blob =
    new Blob(
      info.chunks,
      {
        type:
          info.mime
      }
    );


  /*
   * 受信完了
   */
  receivingFiles.delete(
    id
  );


  /*
   * 受信表示
   */
  addReceivedFile(
    info.name,
    blob
  );


  console.log(
    "受信完了:",
    info.name
  );
}


/* =========================================
   受信ファイル表示
========================================= */

function addReceivedFile(
  fileName,
  blob
) {

  receivedCard.classList.remove(
    "hidden"
  );


  const item =
    document.createElement(
      "div"
    );

  item.className =
    "received-item";


  const top =
    document.createElement(
      "div"
    );

  top.className =
    "received-top";


  const icon =
    document.createElement(
      "div"
    );

  icon.className =
    "file-icon";


  icon.textContent =
    getFileIcon(
      {
        type:
          blob.type,

        name:
          fileName
      }
    );


  const name =
    document.createElement(
      "div"
    );

  name.className =
    "received-name";

  name.textContent =
    fileName;


  const url =
    URL.createObjectURL(
      blob
    );


  const download =
    document.createElement(
      "a"
    );

  download.className =
    "download-button";

  download.href =
    url;

  download.download =
    fileName;

  download.textContent =
    "ダウンロード";


  top.appendChild(
    icon
  );

  top.appendChild(
    name
  );

  top.appendChild(
    download
  );


  item.appendChild(
    top
  );


  /*
   * 画像の場合はプレビュー
   */
  if (
    blob.type.startsWith(
      "image/"
    )
  ) {

    const image =
      document.createElement(
        "img"
      );

    image.className =
      "preview";

    image.src =
      url;

    image.alt =
      fileName;


    item.appendChild(
      image
    );
  }


  receivedList.prepend(
    item
  );
}


/* =========================================
   受信進捗
========================================= */

function showReceivingProgress(
  id,
  name,
  percent
) {

  progressContainer.classList.add(
    "show"
  );


  progressLabel.textContent =
    `受信中: ${name} (${percent}%)`;


  progressBar.style.width =
    `${percent}%`;
}


/* =========================================
   切断
========================================= */

disconnectButton.addEventListener(
  "click",
  () => {

    disconnect();
  }
);


function disconnect() {

  console.log(
    "接続終了"
  );


  /*
   * DataChannel
   */
  if (
    dataChannel
  ) {

    try {

      dataChannel.close();

    } catch (error) {}

    dataChannel =
      null;
  }


  /*
   * PeerConnection
   */
  if (
    peerConnection
  ) {

    try {

      peerConnection.close();

    } catch (error) {}

    peerConnection =
      null;
  }


  /*
   * WebSocket
   */
  if (
    socket
  ) {

    try {

      socket.close();

    } catch (error) {}

    socket =
      null;
  }


  /*
   * 状態リセット
   */
  peerRole =
    null;

  currentRoomId =
    null;

  pendingCandidates =
    [];


  receivingFiles.clear();


  /*
   * UI
   */
  roomCard.classList.remove(
    "hidden"
  );

  connectionCard.classList.add(
    "hidden"
  );

  fileCard.classList.add(
    "hidden"
  );

  receivedCard.classList.add(
    "hidden"
  );

  disconnectArea.classList.add(
    "hidden"
  );


  roomInput.value =
    "";

  selectedFiles =
    [];

  renderFileList();


  progressContainer.classList.remove(
    "show"
  );

  progressBar.style.width =
    "0%";
}


/* =========================================
   初期状態

renderFileList();

console.log(

);
