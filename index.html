<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RikuDrop</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    background: #f5f7fb;
    color: #222;
}

.container {
    width: min(700px, 92%);
    margin: 30px auto;
}

h1 {
    text-align: center;
    margin-bottom: 5px;
}

.subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 25px;
}

.card {
    background: white;
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 18px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 7px;
}

input[type="text"],
input[type="file"] {
    width: 100%;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: #333;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
}

button:hover {
    opacity: 0.9;
}

button:disabled {
    background: #aaa;
    cursor: not-allowed;
}

.roles {
    display: flex;
    gap: 10px;
}

.roles button {
    flex: 1;
}

.status {
    padding: 14px;
    background: #f0f3f8;
    border-radius: 10px;
    text-align: center;
    font-weight: bold;
}

.log {
    height: 300px;
    overflow-y: auto;
    background: #111;
    color: #eee;
    padding: 12px;
    border-radius: 10px;
    font-family: monospace;
    font-size: 13px;
    white-space: pre-wrap;
}

.preview {
    text-align: center;
}

.preview img {
    max-width: 100%;
    max-height: 500px;
    border-radius: 10px;
    margin-top: 10px;
}

.info {
    font-size: 14px;
    color: #666;
    line-height: 1.6;
}

.success {
    color: #16833b;
}

.error {
    color: #c62828;
}
</style>
</head>

<body>

<div class="container">

<h1>📱 RikuDrop</h1>
<div class="subtitle">
iPhone ↔ Windows 画像転送
</div>


<!-- 部屋 -->
<div class="card">

<label>① 同じ部屋番号を入力</label>

<input
    id="room"
    type="text"
    placeholder="例：1234"
>

<div class="info">
iPhoneとWindowsで同じ番号を入力してください。
</div>

</div>


<!-- 役割 -->
<div class="card">

<label>② 自分の端末を選択</label>

<div class="roles">

<button onclick="start('windows')">
💻 Windows
</button>

<button onclick="start('iphone')">
📱 iPhone
</button>

</div>

</div>


<!-- 状態 -->
<div class="card">

<label>接続状態</label>

<div id="status" class="status">
未接続
</div>

</div>


<!-- ファイル -->
<div class="card">

<label>③ 送信する画像</label>

<input
    id="file"
    type="file"
    accept="image/*"
>

<button
    id="sendButton"
    onclick="sendFile()"
    disabled
>
📤 画像を送信
</button>

</div>


<!-- 受信画像 -->
<div class="card preview">

<label>受信した画像</label>

<div id="received">
まだ画像を受信していません
</div>

</div>


<!-- ログ -->
<div class="card">

<label>接続ログ</label>

<div id="log" class="log"></div>

</div>

</div>


<script>

/* =========================================================
   基本設定
========================================================= */

const WORKER_URL =
    "https://ancient-wind-96c6.rikuhira115.workers.dev";


/*
 * 今回はCloudflare STUNのみ使用します。
 *
 * TURNは使用しません。
 * カード情報も不要です。
 */
const ICE_SERVERS = [
    {
        urls: "stun:stun.cloudflare.com:3478"
    }
];


let pc = null;
let ws = null;
let dataChannel = null;

let role = null;
let roomId = null;

let remoteDescriptionSet = false;
let pendingCandidates = [];

let receiveBuffers = [];
let receiveSize = 0;
let receiveFileName = "";
let receiveFileType = "";
let receiveFileSize = 0;


/* =========================================================
   ログ
========================================================= */

function log(message) {

    const time =
        new Date().toLocaleTimeString();

    const logElement =
        document.getElementById("log");

    logElement.textContent +=
        `[${time}] ${message}\n`;

    logElement.scrollTop =
        logElement.scrollHeight;

    console.log(message);
}


/* =========================================================
   ステータス
========================================================= */

function setStatus(message) {

    document.getElementById("status")
        .textContent = message;
}


/* =========================================================
   Cloudflare WebSocket接続
========================================================= */

function connectSignaling() {

    return new Promise((resolve, reject) => {

        const url =
            WORKER_URL +
            "/room/" +
            encodeURIComponent(roomId);

        log("Cloudflare WebSocketへ接続しています...");

        ws = new WebSocket(url);

        ws.onopen = () => {

            log("✓ Cloudflare WebSocket接続成功");

            resolve();
        };


        ws.onerror = (error) => {

            log("× WebSocketエラー");

            console.error(error);

            reject(error);
        };


        ws.onclose = () => {

            log("Cloudflare WebSocket切断");
        };


        ws.onmessage = async (event) => {

            try {

                const message =
                    JSON.parse(event.data);

                await handleSignal(message);

            } catch (error) {

                log(
                    "× 受信データ処理エラー: " +
                    error.message
                );
            }
        };

    });

}


/* =========================================================
   シグナリング送信
========================================================= */

function sendSignal(message) {

    if (
        ws &&
        ws.readyState === WebSocket.OPEN
    ) {

        ws.send(
            JSON.stringify(message)
        );

        log(
            "→ シグナリング送信: " +
            message.type
        );

    } else {

        log(
            "× WebSocketが接続されていません"
        );
    }

}


/* =========================================================
   WebRTC作成
========================================================= */

function createPeerConnection() {

    log("WebRTC接続を作成します...");

    pc =
        new RTCPeerConnection({
            iceServers: ICE_SERVERS
        });


    log(
        "STUNサーバー: " +
        "stun.cloudflare.com:3478"
    );


    /* -----------------------------------------
       ICE候補
    ----------------------------------------- */

    pc.onicecandidate = (event) => {

        if (event.candidate) {

            const candidate =
                event.candidate;

            let type =
                "unknown";

            const text =
                candidate.candidate || "";

            if (text.includes(" typ host ")) {

                type = "host";

            } else if (
                text.includes(" typ srflx ")
            ) {

                type = "srflx";

            } else if (
                text.includes(" typ relay ")
            ) {

                type = "relay";
            }


            log(
                `ICE候補: ${type} / ` +
                `${candidate.protocol || ""}`
            );


            sendSignal({
                type: "ice-candidate",
                candidate:
                    candidate.toJSON()
            });

        } else {

            log(
                "✓ ICE候補の収集が終了しました"
            );
        }

    };


    /* -----------------------------------------
       ICE候補収集状態
    ----------------------------------------- */

    pc.onicegatheringstatechange =
        () => {

            log(
                "ICE候補収集状態: " +
                pc.iceGatheringState
            );
        };


    /* -----------------------------------------
       ICE接続状態
    ----------------------------------------- */

    pc.oniceconnectionstatechange =
        () => {

            log(
                "🌐 ICE接続状態: " +
                pc.iceConnectionState
            );


            if (
                pc.iceConnectionState ===
                "checking"
            ) {

                setStatus(
                    "接続確認中..."
                );

            }


            if (
                pc.iceConnectionState ===
                "connected"
            ) {

                setStatus(
                    "🟢 接続しました"
                );

                log(
                    "🎉 ICE接続成功！"
                );
            }


            if (
                pc.iceConnectionState ===
                "completed"
            ) {

                setStatus(
                    "🟢 接続完了"
                );

                log(
                    "🎉 ICE接続完了！"
                );
            }


            if (
                pc.iceConnectionState ===
                "disconnected"
            ) {

                setStatus(
                    "🟠 接続が切断されました"
                );

                log(
                    "⚠ ICE接続が切断されました"
                );
            }


            if (
                pc.iceConnectionState ===
                "failed"
            ) {

                setStatus(
                    "🔴 接続失敗"
                );

                log(
                    "× ICE接続に失敗しました"
                );
            }
        };


    /* -----------------------------------------
       WebRTC接続状態
    ----------------------------------------- */

    pc.onconnectionstatechange =
        () => {

            log(
                "WebRTC状態: " +
                pc.connectionState
            );


            if (
                pc.connectionState ===
                "connected"
            ) {

                setStatus(
                    "🟢 WebRTC接続成功"
                );
            }


            if (
                pc.connectionState ===
                "failed"
            ) {

                setStatus(
                    "🔴 WebRTC接続失敗"
                );

                log(
                    "× WebRTC接続に失敗しました"
                );
            }
        };


    /* -----------------------------------------
       ICEエラー
    ----------------------------------------- */

    pc.onicecandidateerror =
        (event) => {

            log(
                "⚠ ICE候補エラー"
            );

            log(
                "   code: " +
                event.errorCode
            );

            log(
                "   text: " +
                event.errorText
            );

            if (
                event.errorCode === 701
            ) {

                log(
                    "   STUNサーバーへ到達できません"
                );
            }
        };


    /* -----------------------------------------
       iPhone側
    ----------------------------------------- */

    if (role === "iphone") {

        log(
            "iPhone側：DataChannelを作成"
        );

        dataChannel =
            pc.createDataChannel(
                "rikuDrop"
            );

        setupDataChannel(
            dataChannel
        );
    }


    /* -----------------------------------------
       Windows側
    ----------------------------------------- */

    pc.ondatachannel =
        (event) => {

            log(
                "📦 DataChannelを受信しました"
            );

            dataChannel =
                event.channel;

            setupDataChannel(
                dataChannel
            );
        };

}


/* =========================================================
   DataChannel設定
========================================================= */

function setupDataChannel(channel) {

    channel.binaryType =
        "arraybuffer";


    channel.onopen = () => {

        log(
            "🎉 DataChannel接続成功！"
        );

        setStatus(
            "🟢 接続完了・送信できます"
        );

        document.getElementById(
            "sendButton"
        ).disabled = false;
    };


    channel.onclose = () => {

        log(
            "DataChannel切断"
        );

        document.getElementById(
            "sendButton"
        ).disabled = true;
    };


    channel.onerror = (error) => {

        log(
            "× DataChannelエラー"
        );

        console.error(error);
    };


    channel.onmessage =
        (event) => {

            handleDataMessage(
                event.data
            );
        };

}


/* =========================================================
   シグナリング受信
========================================================= */

async function handleSignal(message) {

    if (!pc) {

        return;
    }


    /* -----------------------------------------
       Offer
    ----------------------------------------- */

    if (
        message.type ===
        "offer"
    ) {

        log(
            "← Offer受信"
        );

        await pc.setRemoteDescription(
            new RTCSessionDescription(
                message.offer
            )
        );

        remoteDescriptionSet = true;

        log(
            "✓ Offer設定完了"
        );


        await addPendingCandidates();


        const answer =
            await pc.createAnswer();

        await pc.setLocalDescription(
            answer
        );

        log(
            "Answer作成"
        );


        sendSignal({
            type: "answer",
            answer: answer
        });

        log(
            "→ Answer送信"
        );
    }


    /* -----------------------------------------
       Answer
    ----------------------------------------- */

    else if (
        message.type ===
        "answer"
    ) {

        log(
            "← Answer受信"
        );

        await pc.setRemoteDescription(
            new RTCSessionDescription(
                message.answer
            )
        );

        remoteDescriptionSet = true;

        log(
            "✓ Answer設定完了"
        );


        await addPendingCandidates();
    }


    /* -----------------------------------------
       ICE Candidate
    ----------------------------------------- */

    else if (
        message.type ===
        "ice-candidate"
    ) {

        const candidate =
            new RTCIceCandidate(
                message.candidate
            );


        if (
            remoteDescriptionSet
        ) {

            try {

                await pc.addIceCandidate(
                    candidate
                );

                log(
                    "✓ ICE候補を追加しました"
                );

            } catch (error) {

                log(
                    "× ICE候補追加失敗: " +
                    error.message
                );
            }

        } else {

            pendingCandidates.push(
                candidate
            );

            log(
                "ICE候補を一時保存しました"
            );
        }
    }

}


/* =========================================================
   待機中のICE候補を追加
========================================================= */

async function addPendingCandidates() {

    for (
        const candidate
        of pendingCandidates
    ) {

        try {

            await pc.addIceCandidate(
                candidate
            );

            log(
                "✓ 保存していたICE候補を追加"
            );

        } catch (error) {

            log(
                "× 保存候補追加失敗: " +
                error.message
            );
        }
    }


    pendingCandidates = [];
}


/* =========================================================
   起動
========================================================= */

async function start(selectedRole) {

    if (
        !document.getElementById(
            "room"
        ).value.trim()
    ) {

        alert(
            "部屋番号を入力してください"
        );

        return;
    }


    roomId =
        document.getElementById(
            "room"
        ).value.trim();


    role =
        selectedRole;


    log(
        "================================"
    );

    log(
        "RikuDrop開始"
    );

    log(
        "役割: " +
        role
    );

    log(
        "部屋: " +
        roomId
    );

    log(
        "================================"
    );


    setStatus(
        "接続準備中..."
    );


    try {

        createPeerConnection();

        await connectSignaling();


        setStatus(
            "🟡 相手を待っています..."
        );


        /*
         * iPhoneが最初にOfferを作ります。
         */

        if (
            role === "iphone"
        ) {

            log(
                "iPhone側の準備完了"
            );

            log(
                "Offerを作成します..."
            );


            const offer =
                await pc.createOffer();


            await pc.setLocalDescription(
                offer
            );


            log(
                "Offer作成完了"
            );


            sendSignal({
                type: "offer",
                offer: offer
            });


            log(
                "✓ Offer送信"
            );

        } else {

            log(
                "Windows側の準備完了"
            );

            log(
                "iPhone側の接続を待っています..."
            );
        }


    } catch (error) {

        console.error(error);

        log(
            "× 起動エラー: " +
            error.message
        );

        setStatus(
            "🔴 エラー"
        );
    }

}


/* =========================================================
   ファイル送信
========================================================= */

async function sendFile() {

    if (
        !dataChannel ||
        dataChannel.readyState !==
        "open"
    ) {

        alert(
            "まだ接続されていません"
        );

        return;
    }


    const input =
        document.getElementById(
            "file"
        );


    if (
        !input.files.length
    ) {

        alert(
            "画像を選択してください"
        );

        return;
    }


    const file =
        input.files[0];


    log(
        "📤 送信開始: " +
        file.name
    );

    log(
        "サイズ: " +
        file.size +
        " bytes"
    );


    /* -----------------------------------------
       ファイル情報
    ----------------------------------------- */

    dataChannel.send(
        JSON.stringify({
            type: "file-info",
            name: file.name,
            size: file.size,
            mime: file.type
        })
    );


    const buffer =
        await file.arrayBuffer();


    const chunkSize =
        16 * 1024;


    let offset = 0;


    while (
        offset < buffer.byteLength
    ) {

        const chunk =
            buffer.slice(
                offset,
                Math.min(
                    offset + chunkSize,
                    buffer.byteLength
                )
            );


        dataChannel.send(
            chunk
        );


        offset +=
            chunk.byteLength;


        const percent =
            Math.floor(
                offset /
                buffer.byteLength *
                100
            );


        setStatus(
            `📤 送信中 ${percent}%`
        );


        /*
         * DataChannelのバッファが
         * 大きくなりすぎないように待つ
         */

        if (
            dataChannel.bufferedAmount >
            1024 * 1024
        ) {

            await new Promise(
                resolve => {

                    const check =
                        () => {

                            if (
                                dataChannel.bufferedAmount <
                                256 * 1024
                            ) {

                                resolve();

                            } else {

                                setTimeout(
                                    check,
                                    20
                                );
                            }
                        };

                    check();
                }
            );
        }
    }


    dataChannel.send(
        JSON.stringify({
            type: "file-end"
        })
    );


    log(
        "✓ 送信完了"
    );


    setStatus(
        "🟢 送信完了"
    );
}


/* =========================================================
   データ受信
========================================================= */

function handleDataMessage(data) {

    /*
     * 文字列なら制御メッセージ
     */

    if (
        typeof data ===
        "string"
    ) {

        try {

            const message =
                JSON.parse(data);


            if (
                message.type ===
                "file-info"
            ) {

                receiveBuffers = [];

                receiveSize = 0;

                receiveFileName =
                    message.name;

                receiveFileType =
                    message.mime;

                receiveFileSize =
                    message.size;


                log(
                    "📥 受信開始: " +
                    receiveFileName
                );

                log(
                    "サイズ: " +
                    receiveFileSize +
                    " bytes"
                );


                setStatus(
                    "📥 画像受信中..."
                );
            }


            else if (
                message.type ===
                "file-end"
            ) {

                finishReceive();
            }


        } catch (error) {

            log(
                "文字列データ: " +
                data
            );
        }


        return;
    }


    /*
     * バイナリデータ
     */

    if (
        data instanceof ArrayBuffer
    ) {

        receiveBuffers.push(
            data
        );


        receiveSize +=
            data.byteLength;


        const percent =
            receiveFileSize
                ? Math.floor(
                    receiveSize /
                    receiveFileSize *
                    100
                )
                : 0;


        setStatus(
            `📥 受信中 ${percent}%`
        );
    }

}


/* =========================================================
   受信完了
========================================================= */

function finishReceive() {

    const blob =
        new Blob(
            receiveBuffers,
            {
                type:
                    receiveFileType ||
                    "image/jpeg"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const img =
        document.createElement(
            "img"
        );


    img.src = url;

    img.alt =
        receiveFileName;


    const container =
        document.getElementById(
            "received"
        );


    container.innerHTML = "";

    container.appendChild(
        img
    );


    log(
        "🎉 画像の受信完了！"
    );


    log(
        "ファイル名: " +
        receiveFileName
    );


    log(
        "受信サイズ: " +
        receiveSize +
        " bytes"
    );


    setStatus(
        "🟢 画像受信完了"
    );


    /*
     * 次回受信用にリセット
     */

    receiveBuffers = [];

    receiveSize = 0;
}


/* =========================================================
   ページ読み込み時
========================================================= */

window.addEventListener(
    "load",
    () => {

        log(
            "RikuDrop起動"
        );

        log(
            "Cloudflare STUNを使用します"
        );

        log(
            "STUN: stun.cloudflare.com:3478"
        );

        log(
            "TURN: 使用しません"
        );

        log(
            "カード情報: 不要"
        );
    }
);

</script>

</body>
</html>
