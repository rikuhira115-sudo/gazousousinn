<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RikuDrop</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 20px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                     sans-serif;
        background: #f5f7fb;
        color: #222;
    }

    .container {
        width: 100%;
        max-width: 600px;
        margin: 0 auto;
    }

    h1 {
        text-align: center;
        margin: 10px 0 5px;
        font-size: 32px;
    }

    .subtitle {
        text-align: center;
        color: #777;
        margin-bottom: 25px;
    }

    .card {
        background: white;
        border-radius: 18px;
        padding: 20px;
        margin-bottom: 16px;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
    }

    label {
        display: block;
        font-weight: bold;
        margin-bottom: 8px;
    }

    input {
        width: 100%;
        padding: 14px;
        border: 1px solid #ccc;
        border-radius: 10px;
        font-size: 18px;
        margin-bottom: 12px;
    }

    button {
        width: 100%;
        border: none;
        border-radius: 12px;
        padding: 15px;
        margin-top: 10px;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
    }

    button:disabled {
        background: #aaa !important;
        cursor: not-allowed;
    }

    .sender {
        background: #4caf50;
        color: white;
    }

    .receiver {
        background: #2196f3;
        color: white;
    }

    .test {
        background: #673ab7;
        color: white;
    }

    #status {
        background: #f1f3f5;
        border-radius: 12px;
        padding: 15px;
        min-height: 180px;
        white-space: pre-wrap;
        word-break: break-word;
        line-height: 1.6;
        font-size: 14px;
    }

    #message {
        display: none;
        margin-top: 15px;
        padding: 15px;
        border-radius: 12px;
        background: #e8f5e9;
        color: #2e7d32;
        font-weight: bold;
    }

    .notice {
        font-size: 14px;
        color: #666;
        line-height: 1.6;
        margin-top: 10px;
    }
</style>
</head>


<body>

<div class="container">

    <h1>RikuDrop</h1>

    <div class="subtitle">
        iPhone ↔ Windows ファイル転送
    </div>


    <!-- ルーム設定 -->
    <div class="card">

        <label for="room">
            ルーム番号
        </label>

        <input
            id="room"
            type="text"
            value="test"
            placeholder="例：test"
            autocomplete="off"
        >

        <button
            id="receiverButton"
            class="receiver"
            onclick="startReceiver()"
        >
            💻 Windows側として接続
        </button>

        <button
            id="senderButton"
            class="sender"
            onclick="startSender()"
        >
            📱 iPhone側として接続
        </button>

        <div class="notice">
            ※ 同じルーム番号を2台で入力してください。<br>
            ※ 先にWindows側、次にiPhone側を接続してください。
        </div>

    </div>


    <!-- 状態 -->
    <div class="card">

        <h3>通信状態</h3>

        <div id="status">まだ接続していません。</div>

        <div id="message"></div>

    </div>


    <!-- テスト -->
    <div class="card">

        <button
            id="testButton"
            class="test"
            onclick="sendTestMessage()"
            disabled
        >
            📡 テストメッセージを送信
        </button>

    </div>

</div>


<script>

/* =========================================================
   Cloudflare Worker
   ========================================================= */

const WORKER_URL =
    "https://ancient-wind-96c6.rikuhira115.workers.dev";


/* =========================================================
   WebRTC / WebSocket 用変数
   ========================================================= */

let socket = null;

let pc = null;

let dataChannel = null;

let remoteDescriptionSet = false;

let pendingCandidates = [];

let currentRole = null;


/* =========================================================
   ログ表示
   ========================================================= */

function log(message) {

    const status =
        document.getElementById("status");

    const now =
        new Date().toLocaleTimeString();

    status.textContent +=
        "\n[" + now + "] " + message;

    status.scrollTop =
        status.scrollHeight;

}


/* =========================================================
   ボタン制御
   ========================================================= */

function disableConnectionButtons() {

    document
        .getElementById("senderButton")
        .disabled = true;

    document
        .getElementById("receiverButton")
        .disabled = true;

}


function enableConnectionButtons() {

    document
        .getElementById("senderButton")
        .disabled = false;

    document
        .getElementById("receiverButton")
        .disabled = false;

}


/* =========================================================
   Cloudflare WebSocket接続
   ========================================================= */

function connectSignaling() {

    return new Promise((resolve, reject) => {

        const room =
            document
                .getElementById("room")
                .value
                .trim();


        if (!room) {

            alert(
                "ルーム番号を入力してください"
            );

            reject(
                new Error(
                    "ルーム番号がありません"
                )
            );

            return;
        }


        const wsURL =
            WORKER_URL
                .replace(
                    "https://",
                    "wss://"
                )
            + "/room/"
            + encodeURIComponent(room);


        log(
            "Cloudflareに接続しています..."
        );


        socket =
            new WebSocket(wsURL);


        /* -----------------------------------------
           WebSocket接続成功
           ----------------------------------------- */

        socket.onopen = () => {

            log(
                "✓ Cloudflare WebSocket接続成功"
            );

            resolve();

        };


        /* -----------------------------------------
           Cloudflareからメッセージ受信
           ----------------------------------------- */

        socket.onmessage = async (event) => {

            try {

                const message =
                    JSON.parse(event.data);

                await handleSignalingMessage(
                    message
                );

            }
            catch (error) {

                console.error(error);

                log(
                    "受信データ処理エラー: "
                    + error.message
                );

            }

        };


        /* -----------------------------------------
           WebSocketエラー
           ----------------------------------------- */

        socket.onerror = (error) => {

            console.error(
                "WebSocket error:",
                error
            );

            log(
                "✕ WebSocketエラー"
            );

            reject(
                new Error(
                    "WebSocket接続に失敗しました"
                )
            );

        };


        /* -----------------------------------------
           WebSocket終了
           ----------------------------------------- */

        socket.onclose = () => {

            log(
                "Cloudflare WebSocket接続終了"
            );

        };

    });

}


/* =========================================================
   Cloudflareへシグナリングデータを送信
   ========================================================= */

function sendSignal(message) {

    if (
        !socket ||
        socket.readyState !== WebSocket.OPEN
    ) {

        log(
            "⚠ WebSocketが接続されていません"
        );

        return false;

    }


    socket.send(
        JSON.stringify(message)
    );

    return true;

}


/* =========================================================
   WebRTC PeerConnection作成
   ========================================================= */

function createPeerConnection() {

    pc =
        new RTCPeerConnection({

            iceServers: [

                {
                    urls:
                        "stun:stun.l.google.com:19302"
                }

            ]

        });


    /* -----------------------------------------
       ICE候補
       ----------------------------------------- */

    pc.onicecandidate =
        (event) => {

            if (event.candidate) {

                sendSignal({

                    type: "ice",

                    candidate:
                        event.candidate

                });

            }

        };


    /* -----------------------------------------
       WebRTC接続状態
       ----------------------------------------- */

    pc.onconnectionstatechange =
        () => {

            log(
                "WebRTC状態: "
                + pc.connectionState
            );


            if (
                pc.connectionState ===
                "connected"
            ) {

                log(
                    "🎉 iPhoneとWindowsが接続されました！"
                );

            }


            if (
                pc.connectionState ===
                "failed"
            ) {

                log(
                    "✕ WebRTC接続に失敗しました"
                );

            }


            if (
                pc.connectionState ===
                "disconnected"
            ) {

                log(
                    "⚠ WebRTC接続が切断されました"
                );

            }

        };


    /* -----------------------------------------
       ICE接続状態
       ----------------------------------------- */

    pc.oniceconnectionstatechange =
        () => {

            console.log(
                "ICE状態:",
                pc.iceConnectionState
            );

        };


    /* -----------------------------------------
       受信側でDataChannelを受け取る
       ----------------------------------------- */

    pc.ondatachannel =
        (event) => {

            log(
                "✓ DataChannelを受信しました"
            );

            dataChannel =
                event.channel;

            setupDataChannel();

        };

}


/* =========================================================
   DataChannel設定
   ========================================================= */

function setupDataChannel() {

    if (!dataChannel) {

        return;

    }


    /* -----------------------------------------
       接続開始
       ----------------------------------------- */

    dataChannel.onopen =
        () => {

            log(
                "✓ DataChannel接続成功"
            );


            document
                .getElementById("testButton")
                .disabled = false;

        };


    /* -----------------------------------------
       接続終了
       ----------------------------------------- */

    dataChannel.onclose =
        () => {

            log(
                "DataChannelが閉じられました"
            );


            document
                .getElementById("testButton")
                .disabled = true;

        };


    /* -----------------------------------------
       エラー
       ----------------------------------------- */

    dataChannel.onerror =
        (error) => {

            console.error(error);

            log(
                "✕ DataChannelエラー"
            );

        };


    /* -----------------------------------------
       データ受信
       ----------------------------------------- */

    dataChannel.onmessage =
        (event) => {

            log(
                "📩 受信: "
                + event.data
            );


            const message =
                document.getElementById(
                    "message"
                );


            message.style.display =
                "block";


            message.textContent =
                "📩 受信しました: "
                + event.data;

        };

}


/* =========================================================
   iPhone側
   ========================================================= */

async function startSender() {

    currentRole =
        "sender";


    disableConnectionButtons();


    document
        .getElementById("status")
        .textContent =
            "iPhone側として接続を開始します";


    try {

        /* -------------------------------------
           まずCloudflare接続を完了させる
           ------------------------------------- */

        await connectSignaling();


        /* -------------------------------------
           WebRTC開始
           ------------------------------------- */

        log(
            "WebRTCを開始します..."
        );


        createPeerConnection();


        /* -------------------------------------
           iPhone側がDataChannelを作る
           ------------------------------------- */

        dataChannel =
            pc.createDataChannel(
                "RikuDrop"
            );


        setupDataChannel();


        /* -------------------------------------
           Offer作成
           ------------------------------------- */

        log(
            "Offerを作成しています..."
        );


        const offer =
            await pc.createOffer();


        await pc.setLocalDescription(
            offer
        );


        log(
            "✓ Offerを作成しました"
        );


        /* -------------------------------------
           Offer送信
           ------------------------------------- */

        const sent =
            sendSignal({

                type: "offer",

                offer:
                    pc.localDescription

            });


        if (sent) {

            log(
                "✓ OfferをWindowsへ送信しました"
            );

        }

    }
    catch (error) {

        console.error(error);

        log(
            "✕ iPhone側の接続に失敗しました"
        );

        log(
            "エラー: "
            + error.message
        );

        enableConnectionButtons();

    }

}


/* =========================================================
   Windows側
   ========================================================= */

async function startReceiver() {

    currentRole =
        "receiver";


    disableConnectionButtons();


    document
        .getElementById("status")
        .textContent =
            "Windows側として接続を開始します";


    try {

        /* -------------------------------------
           Cloudflare接続
           ------------------------------------- */

        await connectSignaling();


        /* -------------------------------------
           WebRTC開始
           ------------------------------------- */

        log(
            "✓ Cloudflare接続完了"
        );


        log(
            "WebRTC受信準備をしています..."
        );


        createPeerConnection();


        log(
            "✓ Windows側の準備完了"
        );


        log(
            "iPhone側の接続を待っています..."
        );

    }
    catch (error) {

        console.error(error);

        log(
            "✕ Windows側の接続に失敗しました"
        );

        log(
            "エラー: "
            + error.message
        );

        enableConnectionButtons();

    }

}


/* =========================================================
   シグナリング処理
   ========================================================= */

async function handleSignalingMessage(
    message
) {

    console.log(
        "シグナリング受信:",
        message
    );


    /* =====================================================
       Offerを受信
       ===================================================== */

    if (
        message.type === "offer"
    ) {

        log(
            "📨 Offerを受信しました"
        );


        /*
         * Windows側にPeerConnectionが
         * なければ作成する
         */

        if (!pc) {

            createPeerConnection();

        }


        /* -------------------------------------
           Remote Description設定
           ------------------------------------- */

        await pc.setRemoteDescription(

            new RTCSessionDescription(
                message.offer
            )

        );


        remoteDescriptionSet =
            true;


        log(
            "✓ Offerを設定しました"
        );


        /* -------------------------------------
           保留していたICE候補を追加
           ------------------------------------- */

        for (
            const candidate
            of pendingCandidates
        ) {

            try {

                await pc.addIceCandidate(
                    candidate
                );

            }
            catch (error) {

                console.error(
                    "ICE追加エラー:",
                    error
                );

            }

        }


        pendingCandidates = [];


        /* -------------------------------------
           Answer作成
           ------------------------------------- */

        log(
            "Answerを作成しています..."
        );


        const answer =
            await pc.createAnswer();


        await pc.setLocalDescription(
            answer
        );


        log(
            "✓ Answerを作成しました"
        );


        /* -------------------------------------
           Answer送信
           ------------------------------------- */

        const sent =
            sendSignal({

                type: "answer",

                answer:
                    pc.localDescription

            });


        if (sent) {

            log(
                "✓ AnswerをiPhoneへ送信しました"
            );

        }

    }


    /* =====================================================
       Answerを受信
       ===================================================== */

    else if (
        message.type === "answer"
    ) {

        log(
            "📨 Answerを受信しました"
        );


        if (!pc) {

            log(
                "⚠ PeerConnectionがありません"
            );

            return;

        }


        await pc.setRemoteDescription(

            new RTCSessionDescription(
                message.answer
            )

        );


        remoteDescriptionSet =
            true;


        log(
            "✓ Answerを設定しました"
        );


        /* -------------------------------------
           保留していたICE候補を追加
           ------------------------------------- */

        for (
            const candidate
            of pendingCandidates
        ) {

            try {

                await pc.addIceCandidate(
                    candidate
                );

            }
            catch (error) {

                console.error(
                    "ICE追加エラー:",
                    error
                );

            }

        }


        pendingCandidates = [];

    }


    /* =====================================================
       ICE候補を受信
       ===================================================== */

    else if (
        message.type === "ice"
    ) {

        if (!pc) {

            log(
                "⚠ PeerConnectionがありません"
            );

            return;

        }


        const candidate =
            new RTCIceCandidate(
                message.candidate
            );


        /*
         * RemoteDescriptionが設定済みなら
         * すぐ追加する
         */

        if (
            remoteDescriptionSet
        ) {

            try {

                await pc.addIceCandidate(
                    candidate
                );

            }
            catch (error) {

                console.error(
                    "ICE追加エラー:",
                    error
                );

            }

        }
        else {

            /*
             * まだOffer/Answerが来ていない場合は
             * 一旦保存する
             */

            pendingCandidates.push(
                candidate
            );

        }

    }

}


/* =========================================================
   テストメッセージ送信
   ========================================================= */

function sendTestMessage() {

    if (
        !dataChannel ||
        dataChannel.readyState !== "open"
    ) {

        alert(
            "まだiPhoneとWindowsが接続されていません"
        );

        return;

    }


    let message;


    if (
        currentRole === "sender"
    ) {

        message =
            "HELLO_FROM_IPHONE";

    }
    else {

        message =
            "HELLO_FROM_WINDOWS";

    }


    dataChannel.send(
        message
    );


    log(
        "📤 送信: "
        + message
    );

}


/* =========================================================
   ページ読み込み時
   ========================================================= */

window.addEventListener(
    "load",
    () => {

        log(
            "RikuDropを起動しました"
        );

        log(
            "同じルーム番号で接続してください"
        );

    }
);

</script>

</body>
</html>
